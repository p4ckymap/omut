<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Омут</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiny5&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Раскладка: одна колонка-телефон (до 440px). Сверху аватар соперника и его рука рубашками, затем 4 мира соперника, полоса подсказки, 4 твоих мира, веер руки, нижняя панель.
   Одна тёмная тема по замыслу: ночь, пиксельные рамки, золото монет как единственный акцент. Красный — только жизни и угроза. */
:root{
  color-scheme: dark;
  --bg:#0c0d0e; --panel:#16181a; --panel2:#1f2225; --line:#3b3f43; --line2:#5a5f64;
  --ink:#ece6d6; --muted:#9d988c; --dim:#6a6d70;
  --gold:#e2b33c; --gold-ink:#241903; --blood:#e2483c; --heal:#94d36c;
  --r-common:#aeb2b7; --r-rare:#4f8fd6; --r-epic:#a35cff; --r-legend:#e2b33c;
  --f-pix:"Tiny5","Courier New",monospace;
  --f-text:"Golos Text","Segoe UI",Roboto,sans-serif;
  --notch:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);
  --ol:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000,1px 1px #000,-1px -1px #000;
}
*{box-sizing:border-box}
html,body{height:100%}
body{font-synthesis:none;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.4;padding:0 0;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
img{image-rendering:pixelated}
.phone{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 12px 12px;position:relative}
.pix{font-family:var(--f-pix)}
.ico{display:inline-block;width:1em;height:1em;vertical-align:-.12em;flex:none}
.ico svg{width:100%;height:100%;display:block}

/* пиксельная рамка */
.frame{--c:var(--line2);position:relative;background:var(--panel);border:2px solid var(--c);clip-path:var(--notch);box-shadow:inset 0 0 0 2px #060606,inset 0 0 0 3px color-mix(in srgb,var(--c) 45%,#000)}
.pbtn{--c:var(--line2);display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;font-family:var(--f-pix);font-weight:600;font-size:18px;letter-spacing:.02em;background:var(--panel2);border:2px solid var(--c);clip-path:var(--notch);box-shadow:inset 0 0 0 2px #060606,inset 0 -4px 0 2px rgba(0,0,0,.35);transition:transform .1s}
.pbtn:active{transform:translateY(2px)}
.pbtn:hover{--c:var(--ink)}
.pbtn.gold{--c:var(--gold);background:#2a2208;color:var(--gold)}
.pbtn.gold:hover{background:#3a2e0a}
.pbtn[disabled]{opacity:.4;cursor:not-allowed}
.sq{width:44px;height:44px;min-height:0;padding:0;font-size:22px}

/* ---------- меню ---------- */
.menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-block:20px;position:relative;isolation:isolate}
.menu::before{content:"";position:absolute;inset:-10px -12px;background:url(assets/world-omut.png) center/cover;image-rendering:pixelated;opacity:.35;z-index:-1}
.logo{font-family:var(--f-pix);font-weight:700;font-size:84px;line-height:.9;letter-spacing:.04em;color:var(--ink);text-shadow:4px 4px 0 #000,0 0 0 #000}
.slogan{font-family:var(--f-pix);font-size:17px;color:var(--gold);text-shadow:var(--ol)}
.menufan{position:relative;height:250px;width:100%;margin:8px 0 6px}
.menufan .card{box-shadow:0 14px 30px rgba(0,0,0,.7)}
.menubtns{display:grid;gap:10px;width:100%;max-width:300px}
.menubtns .gold{min-height:56px;font-size:24px}
.lives{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--f-pix);font-size:16px;color:var(--muted)}
.lives .pbtn{width:36px;height:36px;min-height:0;padding:0;font-size:20px}
.lives b{color:var(--ink);font-size:20px;min-width:2ch;font-variant-numeric:tabular-nums}

/* ---------- верхние/нижние панели ---------- */
.bar{display:flex;align-items:center;gap:12px}
.ava{width:52px;height:52px;flex:none;padding:3px;--c:var(--line2)}
.ava img{width:100%;height:100%;object-fit:cover;display:block;clip-path:var(--notch)}
.vit{display:flex;align-items:center;gap:6px;font-family:var(--f-pix);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;position:relative}
.vit .ico{font-size:24px}
.vit.hp .ico{color:var(--blood)}.vit.cn .ico{color:var(--gold)}
.bar .sp{flex:1}
.turnmark{font-family:var(--f-pix);font-size:13px;color:var(--gold);padding:2px 6px;border:1px solid var(--gold)}

/* рука соперника */
.efan{position:relative;height:84px;margin-top:2px}
.efan .bk{position:absolute;top:4px;left:50%;width:48px;aspect-ratio:118/194;transform-origin:50% 140%}
.efan .bk img{width:100%;height:100%;display:block}
.piles{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;pointer-events:none}
.pile{display:flex;align-items:center;gap:6px;font-family:var(--f-pix);font-size:16px;color:var(--muted)}
.pile .frame{width:30px;height:30px;display:grid;place-items:center;font-size:18px;color:var(--muted)}

/* ---------- поле ---------- */
.board{display:grid;gap:6px;margin-top:6px}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.world{--c:#4a2a2a;position:relative;aspect-ratio:217/360;max-width:100%;overflow:hidden;border:2px solid var(--c);clip-path:var(--notch);background:#111}
.row.mine .world{--c:#45494d}
.world .bg{position:absolute;inset:0;background-size:cover;background-position:center;image-rendering:pixelated}
.world .wi{position:absolute;right:4px;bottom:4px;font-size:16px;color:var(--wc);filter:drop-shadow(1px 1px 0 #000)}
.slots{position:absolute;left:6%;right:6%;top:5%;display:grid;grid-template-columns:1fr 1fr;gap:6%}
.slot{aspect-ratio:5/8;border:1px dashed rgba(236,230,214,.45);display:grid;place-items:center;font-family:var(--f-pix);font-size:10px;color:var(--gold);text-align:center;line-height:1.05}
.slot.can{border:2px solid var(--gold);background:rgba(226,179,60,.18)}
.slot.no{border-color:rgba(226,72,60,.5)}
.slot.face{border:2px solid var(--blood);background:rgba(226,72,60,.25);color:#ffb0a8;animation:pulse 1.1s infinite}
@keyframes pulse{50%{background:rgba(226,72,60,.45)}}
.hint{min-height:34px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1.25;color:var(--muted);padding:2px 6px}
.hint.bad{color:#ff9a90}.hint.bot{color:#e7a59d}

/* ---------- карта ---------- */
.card{--c:var(--r-common);position:relative;display:block;width:100%;aspect-ratio:5/8;container-type:inline-size;background:#0a0b0c;border:2px solid var(--c);clip-path:var(--notch);box-shadow:inset 0 0 0 2px #050505,inset 0 0 0 4px color-mix(in srgb,var(--c) 40%,#000);overflow:hidden;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card[data-r="rare"]{--c:var(--r-rare)}.card[data-r="epic"]{--c:var(--r-epic)}.card[data-r="legend"]{--c:var(--r-legend)}
.card .art{position:absolute;inset:4px;background-size:cover;background-position:center top;image-rendering:pixelated}
.card .hd{position:absolute;left:7%;right:7%;top:5%;display:grid;grid-template-columns:1fr auto;gap:0 4%;align-items:start;z-index:2}
.card .nm{font-family:var(--f-pix);font-weight:700;font-size:13cqi;line-height:1;text-shadow:var(--ol);overflow-wrap:anywhere}
.card .rr{grid-column:1;font-family:var(--f-text);font-weight:600;font-size:8.5cqi;color:var(--c);text-shadow:var(--ol);margin-top:2%}
.card[data-r="common"] .rr{color:#c9ccd0}
.card .ci{grid-row:1/3;grid-column:2;width:17cqi;height:17cqi;color:var(--cc);filter:drop-shadow(1px 1px 0 #000)}
.card .ci svg{width:100%;height:100%}
.card .pr{position:absolute;right:7%;top:28%;width:15cqi;height:15cqi;color:var(--ink);filter:drop-shadow(1px 1px 0 #000);z-index:2}
.card .st{position:absolute;left:4px;right:4px;bottom:4px;height:15%;display:flex;align-items:center;justify-content:space-evenly;background:rgba(5,5,6,.82);font-family:var(--f-pix);font-weight:700;font-size:13cqi;font-variant-numeric:tabular-nums;z-index:2}
.card .st span{display:flex;align-items:center;gap:3cqi}
.card .st .ico{width:11cqi;height:11cqi}
.card .st .h .ico{color:var(--ink)}.card .st .h.hurt{color:#ff6a5e}.card .st .h.hurt .ico{color:#ff6a5e}
.card .st .a .ico{color:#d9d2bf}.card .st .c .ico{color:var(--gold)}
.card .st i{width:1px;height:50%;background:var(--line2)}
.card .st .kind{font-family:var(--f-text);font-weight:600;font-size:9cqi;color:var(--muted)}
.card .chips{position:absolute;left:7%;bottom:21%;display:flex;flex-wrap:wrap;gap:3cqi;z-index:2}
.card .chip{font-family:var(--f-pix);font-size:8cqi;line-height:1;padding:2cqi 3cqi;background:rgba(0,0,0,.85)}
.chip.poison{color:var(--heal)}.chip.wait{color:var(--muted)}.chip.up{color:var(--gold)}
.board .card .rr{display:none}
.board .card .nm{font-size:12cqi}
.card.ready{--c:var(--gold)}
.card.sel{transform:translateY(-3px);filter:brightness(1.15)}
.card.tg{--c:var(--blood);animation:tg 1s infinite}
.card.ally{--c:var(--heal)}
@keyframes tg{50%{filter:brightness(1.35)}}
.card.hit{animation:hit .35s}
@keyframes hit{25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-1px)}}
.fx{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--f-pix);font-weight:700;font-size:20px;color:#ff6a5e;text-shadow:var(--ol);pointer-events:none;animation:rise 1s forwards;z-index:9;white-space:nowrap}
.fx.heal{color:var(--heal)}.fx.gold{color:var(--gold)}
@keyframes rise{to{transform:translate(-50%,-30px);opacity:0}}

/* ---------- рука ---------- */
.hand{position:relative;height:166px;margin-top:4px}
.hand .hc{position:absolute;bottom:6px;left:50%;width:88px;transform-origin:50% 130%;transition:transform .18s;touch-action:none}
.hand .hc.sel{z-index:20}
.hand .hc.unaff .card{filter:saturate(.35) brightness(.6)}
.hand .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.ghost{position:fixed;z-index:100;width:96px;pointer-events:none;transform:translate(-50%,-60%) rotate(-4deg);filter:drop-shadow(0 12px 18px rgba(0,0,0,.7))}
.bottom{margin-top:4px}
.endbtn{flex:1;max-width:180px;white-space:nowrap;font-size:17px}
.acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:0}
.acts .pbtn{min-height:38px;font-size:15px;padding:0 12px}
.acts .pbtn.on{--c:var(--gold);color:var(--gold)}

/* ---------- окно карты (оборот) ---------- */
.modal{position:fixed;inset:0;z-index:200;background:rgba(3,4,5,.86);display:grid;place-items:center;padding:16px}
.modal .box{display:grid;justify-items:center;gap:12px;width:min(340px,100%)}
.flip{width:min(300px,100%);perspective:1100px}
.flip .inner{position:relative;width:100%;aspect-ratio:5/8;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .ff,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .fb{transform:rotateY(180deg);visibility:hidden}
.flip .ff,.flip .fb{transition:visibility 0s .27s}
.flip.on .ff{visibility:hidden}.flip.on .fb{visibility:visible}
.flip .card .nm{font-size:12cqi}
.back{--c:var(--r-common);position:absolute;inset:0;background:#0d0d0c;border:3px solid var(--c);clip-path:var(--notch);box-shadow:inset 0 0 0 3px #050505,inset 0 0 0 5px color-mix(in srgb,var(--c) 40%,#000);padding:6% 7%;display:flex;flex-direction:column;gap:2.4cqi;container-type:inline-size;overflow:auto}
.back[data-r="rare"]{--c:var(--r-rare)}.back[data-r="epic"]{--c:var(--r-epic)}.back[data-r="legend"]{--c:var(--r-legend)}
.back .t{display:grid;grid-template-columns:1fr auto;align-items:start}
.back .t h3{font-family:var(--f-pix);font-weight:700;font-size:12cqi;line-height:1}
.back .t .rr{font-family:var(--f-pix);font-weight:600;font-size:6.5cqi;color:var(--c);margin-top:1cqi}
.back[data-r="common"] .t .rr{color:#c9ccd0}
.back .t .ci{width:11cqi;height:11cqi;color:var(--c)}
.back .t .ci svg{width:100%;height:100%}
.back .rows{display:grid;gap:1cqi;font-size:5cqi}
.back .rows div{display:flex;align-items:center;gap:4cqi}
.back .rows .ico{width:6cqi;height:6cqi;color:var(--c)}
.back .rows b{font-weight:600;color:var(--c)}
.back[data-r="common"] .rows b,.back[data-r="common"] .rows .ico{color:#d6d9dc}
.back .div{display:flex;align-items:center;gap:3cqi;color:var(--c);font-family:var(--f-pix);font-weight:600;font-size:5.6cqi;color:var(--ink)}
.back .div::before,.back .div::after{content:"";flex:1;height:2px;background:var(--c)}
.back .div.plain{gap:0}
.back .fl{font-size:4.8cqi;line-height:1.35;color:#d9d3c3}
.back .ab{display:grid;grid-template-columns:auto 1fr;gap:1cqi 4cqi;align-items:start}
.back .ab .ico{width:8cqi;height:8cqi;color:var(--c);grid-row:span 2;margin-top:1cqi}
.back[data-r="common"] .ab .ico{color:#d6d9dc}
.back .ab h4{margin:0;font-family:var(--f-pix);font-weight:600;font-size:6cqi;color:var(--c)}
.back[data-r="common"] .ab h4{color:#e5e7ea}
.back .ab p{font-size:4.6cqi;line-height:1.25}
.back .bounty{display:flex;align-items:center;justify-content:center;gap:3cqi;font-size:5.6cqi;margin-top:auto;padding-top:2cqi}
.back .bounty .ico{width:7cqi;height:7cqi;color:var(--gold)}
.mhint{font-size:13px;color:var(--muted);text-align:center}
.mbtns{display:flex;gap:8px}

/* ---------- прочие экраны ---------- */
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.head h2{font-family:var(--f-pix);font-weight:700;font-size:28px;flex:1}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.coin{width:120px;height:120px;display:grid;place-items:center;font-family:var(--f-pix);font-weight:700;font-size:28px;color:var(--gold-ink);background:var(--gold);clip-path:polygon(30% 0,70% 0,70% 6%,85% 6%,85% 15%,94% 15%,94% 30%,100% 30%,100% 70%,94% 70%,94% 85%,85% 85%,85% 94%,70% 94%,70% 100%,30% 100%,30% 94%,15% 94%,15% 85%,6% 85%,6% 70%,0 70%,0 30%,6% 30%,6% 15%,15% 15%,15% 6%,30% 6%)}
.coin.spin{animation:spin 1.4s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{0%{transform:rotateY(0)}45%{transform:rotateY(900deg) translateY(-50px)}100%{transform:rotateY(1800deg)}}
.big{font-family:var(--f-pix);font-weight:700;font-size:26px}
.muted{color:var(--muted)}
.mull{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.mull .pick{position:relative}
.mull .pick.marked .card{filter:brightness(.4)}
.mull .pick.marked::after{content:"Заменить";position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-family:var(--f-pix);font-weight:600;font-size:14px;color:#fff;background:var(--blood);padding:2px 8px}
.res .big{font-size:48px;line-height:1}
.res .lose{color:#ff8f85}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;margin:0}
.stats div{padding:10px 12px;text-align:left}
.stats dt{font-size:13px;color:var(--muted)}.stats dd{margin:0;font-family:var(--f-pix);font-weight:700;font-size:26px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{display:flex;align-items:center;gap:6px;font-family:var(--f-pix);font-size:15px;padding:6px 10px;border:2px solid var(--line);clip-path:var(--notch)}
.filters button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rules{display:grid;gap:10px}
.rule{padding:14px 16px;display:grid;gap:8px}
.rule h3{font-family:var(--f-pix);font-weight:600;font-size:19px;color:var(--gold)}
.rule p,.rule li{font-size:14.5px}
.rule ul{margin:0;padding-left:18px;display:grid;gap:4px}
.rule b{color:var(--ink)}
.sheet{width:min(360px,100%);padding:18px;display:grid;gap:12px}
.sheet h3{font-family:var(--f-pix);font-size:22px}
@media (prefers-reduced-motion:reduce){.coin.spin,.slot.face,.card.tg,.card.hit,.flip .inner,.hand .hc{animation:none;transition:none}.fx{display:none}}
</style>

<div id="app" class="phone"></div>
<div id="modal"></div>

<script>
(function(){
// ===== пиксельные иконки: сетка → SVG =====
function pxIcon(rows){const h=rows.length,w=rows[0].length;let r='';rows.forEach((row,y)=>{let x=0;while(x<w){if(row[x]==='X'){let s=x;while(x<w&&row[x]==='X')x++;r+=`<rect x="${s}" y="${y}" width="${x-s}" height="1"/>`}else x++}});return `<svg viewBox="0 0 ${w} ${h}" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
const P={
 heart:pxIcon([".XX...XX.","XXXX.XXXX","XXXXXXXXX","XXXXXXXXX",".XXXXXXX.","..XXXXX..","...XXX...","....X...."]),
 coin:pxIcon(["..XXXXX..",".XXXXXXX.","..XXXXX..",".X.....X.",".XXXXXXX.",".X.....X.",".XXXXXXX.",".X.....X.",".XXXXXXX."]),
 sword:pxIcon(["......XXX","......X.X",".....X.XX","....X.X..","X..X.X...",".XX.X....","..XX.....",".X..X....","X........"]),
 sun:pxIcon(["....X....",".X.....X.","...XXX...","..XXXXX..","X.XXXXX.X","..XXXXX..","...XXX...",".X.....X.","....X...."]),
 skull:pxIcon(["..XXXXX..",".XXXXXXX.","XXXXXXXXX","XX..X..XX","XX..X..XX","XXXXXXXXX",".XXX.XXX.","..XXXXX..","..X.X.X.."]),
 eye:pxIcon(["...XXXXX...","..X.....X..",".X..XXX..X.","X..XX.XX..X",".X..XXX..X.","..X.....X..","...XXXXX..."]),
 tree:pxIcon(["....X....","...XXX...","..XXXXX..","...XXX...","..XXXXX..",".XXXXXXX.","..XXXXX..",".XXXXXXX.","XXXXXXXXX","....X....","...XXX..."]),
 wave:pxIcon(["....XXX....","..XX...X...",".X....X.X..","X....X...X.","X...X..XX..",".XXX..X..XX","XX..XX..XX.","..XX..XX..."]),
 flame:pxIcon(["....X....","...XX....","...XXX...","..XXXX.X.",".XXXXXXX.",".XXX.XXX.","XXX...XXX","XX..X..XX",".XX...XX.","..XXXXX.."]),
 swirl:pxIcon(["..XXXXX..",".X.....X.","X..XXX..X","X.X...X.X","X.X.X.X.X","X.X..XX.X","X..X....X",".X..XXXX.","..XX....."]),
 tent:pxIcon(["..XXX....",".X...X...","X..X..X..","X.X.X.X..","X..X..X..",".X....X..","..X..X...","...XX....","..XX.....",".XX......"]),
 shield:pxIcon(["XXXXXXXXX","X.......X","X.XXXXX.X","X.XXXXX.X","X.XXXXX.X",".X.XXX.X.",".X.XXX.X.","..X.X.X..","...X.X...","....X...."]),
 gear:pxIcon(["....XXX....",".X..XXX..X.","..XXXXXXX..","..XX...XX..","XXX.....XXX","XXX.....XXX","XXX.....XXX","..XX...XX..","..XXXXXXX..",".X..XXX..X.","....XXX...."]),
 door:pxIcon(["XXXXXX...","X....X...","X....X...","X..X.X..X","X....X.XX","X....XXXX","X....X.XX","X....X..X","XXXXXX..."]),
 gem:pxIcon([".XXXXXXX.","XX.X.X.XX","XXXXXXXXX",".XXXXXXX.","..XXXXX..","...XXX...","....X...."]),
 drop:pxIcon(["....X....","...XXX...","..XXXXX..",".XXXXXXX.","XXXXXXXXX","XXXXXXXXX","XXXXXXXXX",".XXXXXXX.","..XXXXX.."]),
 plus:pxIcon(["XXXXXXX...","XXXXXXX...","..........","XXXXXXX.X.","XXXXXXXXXX","........X.","XXXXXXX...","XXXXXXX..."]),
 rune:pxIcon(["....X....","X...X...X",".X..X..X.","..X.X.X..","...XXX...","..X.X.X..",".X..X..X.","X...X...X","....X...."])
};
const ic=(k,cls)=>`<span class="ico ${cls||''}">${P[k]}</span>`;

// ===== миры и классы =====

function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function buildArt(){
 const worlds={};for(const k of ORDER)worlds[k]=await loadImg(WIMG(k));
 for(const d of [...DEFS,FROG]){
  if(ART[d.id])continue;
  const W=50,H=64,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  const wi=worlds[worldOf(d)];
  if(wi){const s=Math.max(W/wi.width,H/wi.height);g.drawImage(wi,(W-wi.width*s)/2,(H-wi.height*s)/2,wi.width*s,wi.height*s)}else{g.fillStyle='#111';g.fillRect(0,0,W,H)}
  const accent=WORLDS[worldOf(d)].c;
  const mk=col=>`data:image/svg+xml;charset=utf-8,`+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 256"><g fill="${col}" color="${col}" transform="translate(0,40)">${SIL[d.sil]}</g></svg>`);
  const rim=await loadImg(mk(accent)),body=await loadImg(mk('#07080a'));
  if(rim){g.globalAlpha=.55;g.drawImage(rim,-1,-1,W,H);g.globalAlpha=1}
  if(body)g.drawImage(body,0,0,W,H);
  try{ART[d.id]=cv.toDataURL()}catch(e){}
 }
}

function cardFront(d,inst,o){
 o=o||{};
 const cc=d.type==='c'?WORLDS[CLASS_WORLD[d.cls]].c:'#e8e0c8';
 const atk=inst?inst.atk:d.atk,hp=inst?inst.hp:d.hp,prio=inst?isPrio(inst):has(d,'Приоритет');
 const chips=[];
 if(inst){if(inst.poison)chips.push('<span class="chip poison">яд</span>');if(inst.sick&&!has(d,'Рывок')&&d.atk>0&&G&&G.turn===inst.owner)chips.push('<span class="chip wait">ждёт</span>');if(inst.upg)chips.push(`<span class="chip up">+${inst.upg}</span>`)}
 const st=d.type==='c'
  ?`<span class="h${inst&&inst.hp<inst.maxHp?' hurt':''}">${ic('heart')}${hp}</span><i></i><span class="a">${ic('sword')}${atk}</span><i></i><span class="c">${ic('coin')}${d.cost}</span>`
  :`<span class="kind">Чары</span><i></i><span class="c">${ic('coin')}${d.cost}</span>`;
 return `<div class="card ${o.cls||''}" data-r="${d.r}" data-def="${d.id}" ${inst?`data-uid="${inst.uid}" data-side="${inst.owner}"`:''} ${o.attrs||''} style="--cc:${cc}" aria-label="${d.name}">
  <div class="art" style="background-image:url('${ART[d.id]||WIMG(worldOf(d))}')"></div>
  <div class="hd"><div class="nm">${d.name}</div><div class="rr">${R_NAME[d.r]}</div><span class="ci">${d.type==='c'?P[CLASS_ICON[d.cls]]:P.rune}</span></div>
  ${prio?`<span class="pr" title="Приоритет">${P.shield}</span>`:''}
  ${chips.length?`<div class="chips">${chips.join('')}</div>`:''}
  <div class="st">${st}</div>
 </div>`;
}
function cardBack(d,inst){
 const wk=worldOf(d),w=WORLDS[wk];
 const rows=d.type==='c'
  ?[[CLASS_ICON[d.cls],'Класс',d.cls],[w.ico,'Мир',w.name],['gem','Редкость',`<b>${R_NAME[d.r]}</b>`],['coin','Цена',d.cost]]
  :[['rune','Тип','Чары, разовое действие'],['gem','Редкость',`<b>${R_NAME[d.r]}</b>`],['coin','Цена',d.cost]];
 if(d.type==='c')rows.splice(3,0,['heart','Здоровье',inst?`${inst.hp} из ${inst.maxHp}`:d.hp],['sword','Урон',inst?inst.atk+(inst.upg?` (закалка +${inst.upg})`:''):d.atk]);
 const abs=d.kw.map(kwText).filter(Boolean);
 return `<div class="back" data-r="${d.r}">
  <div class="t"><div><h3>${d.name}</h3><div class="rr">${R_NAME[d.r]}</div></div><span class="ci">${d.type==='c'?P[CLASS_ICON[d.cls]]:P.rune}</span></div>
  <div class="rows">${rows.map(([i,k,v])=>`<div>${ic(i)}<span>${k}: ${v}</span></div>`).join('')}</div>
  <div class="div plain"></div>
  <p class="fl">${d.fl}</p>
  ${abs.length?`<div class="div">Способности</div>${abs.map(a=>`<div class="ab">${ic(a.icon)}<h4>${a.name}</h4><p>${a.text}</p></div>`).join('')}`:''}
  ${d.type==='c'?`<div class="div plain"></div><div class="bounty">${ic('coin')}За убийство: ${coins(d.reward)}</div>`:''}
 </div>`;
}
function flipHTML(d,inst,id){return `<div class="flip" ${id?`id="${id}"`:''}><div class="inner"><div class="ff">${cardFront(d,inst)}</div><div class="fb">${cardBack(d,inst)}</div></div></div>`}

let G=null,screen='menu',uidN=1,busy=false,fx=[],startHp=25,bestFilter='all',lastBot='';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function newGame(){
 const deck=[];DEFS.forEach(d=>{for(let i=0;i<COPIES[d.r];i++)deck.push(d.id)});shuffle(deck);
 G={worlds:shuffle(ORDER.slice()).slice(0,NW),board:[0,1].map(()=>Array.from({length:NW},()=>[null,null])),hand:[[],[]],deck,discard:[],
  hp:[startHp,startHp],maxHp:startHp+5,coins:[3,3],turn:0,turnNo:[0,0],first:Math.random()<.5?0:1,burned:0,mode:null,drain:false,over:null,
  stats:{kills:[0,0],earned:[0,0],spent:[0,0]},marks:[]};
 for(let p=0;p<2;p++)for(let i=0;i<5;i++)draw(p,true);
 G.coins[1-G.first]+=1;
}
function draw(p,silent){
 if(!G.deck.length){if(!G.discard.length)return;G.deck=shuffle(G.discard.filter(id=>id!=='frog'));G.discard=[];G.drain=true;say(null,'Омут опустел. Теперь каждый ход оба теряют по 1 жизни.')}
 const id=G.deck.pop();if(!id)return;
 if(G.hand[p].length>=8){G.discard.push(id);if(!silent)say(p,`${who(p)}: рука полна, ${D[id].name} уходит на Дно.`);return}
 G.hand[p].push({hid:uidN++,id});
}
const who=p=>p===0?'Ты':'Бот';
function say(p,t){if(p===1||p===null)lastBot=t}
function isPrio(c){return has(D[c.id],'Приоритет')||c.tempPrio}
function cardsOf(p){const r=[];G.board[p].forEach((w,wi)=>w.forEach((c,s)=>{if(c)r.push({c,w:wi,s})}));return r}
function locate(uid){for(let p=0;p<2;p++)for(let w=0;w<NW;w++)for(let s=0;s<2;s++){const c=G.board[p][w][s];if(c&&c.uid===uid)return{p,w,s,c}}return null}
const income=n=>[2,2,3,3,4,4][n-1]||5;
function addCoins(p,n){const b=G.coins[p];G.coins[p]=Math.min(10,G.coins[p]+n);G.stats.earned[p]+=G.coins[p]-b}
// Правило класса: первая карта — куда угодно. Пара: один класс, или одна из двух — родного класса мира.
function canPlace(p,w,s,id){
 const d=D[id];if(d.type!=='c')return{ok:false,why:'Чары не ставятся в мир.'};
 const f=G.board[p][w];if(f[s])return{ok:false,why:'Место занято.'};
 const o=f[1-s];if(!o)return{ok:true};
 const wd=WORLDS[G.worlds[w]],oc=D[o.id].cls;
 if(oc===d.cls)return{ok:true};
 if(wd.cls&&(d.cls===wd.cls||oc===wd.cls))return{ok:true};
 if(!wd.cls)return{ok:false,why:`В Омуте пара может быть только одного класса. Тут уже стоит ${oc}.`};
 return{ok:false,why:`В мире ${wd.name} нельзя ставить вместе ${oc} и ${d.cls}. Пара должна быть одного класса или одна карта — класса ${wd.cls}.`};
}
function makeInst(id,p){const d=D[id];return{uid:uidN++,id,owner:p,atk:d.atk,hp:d.hp,maxHp:d.hp,sick:!has(d,'Рывок'),attacked:false,poison:0,stoykUsed:false,tempPrio:false,upg:0,upgTurn:false}}
function place(p,w,s,id,copy){
 const inst=makeInst(id,p);G.board[p][w][s]=inst;
 say(p,`${who(p)}: ${copy?'копия ':''}${D[id].name} в мир ${WORLDS[G.worlds[w]].name}.`);
 if(id==='yaga'){const t=cardsOf(1-p).filter(x=>D[x.c.id].r!=='legend'&&x.c.id!=='frog').sort((a,b)=>(b.c.atk+b.c.hp)-(a.c.atk+a.c.hp))[0];
  if(t){const old=D[t.c.id].name;const fr=makeInst('frog',1-p);fr.sick=false;G.board[1-p][t.w][t.s]=fr;say(p,`Баба-Яга превращает ${old} в Жабу.`);fx.push({uid:fr.uid,t:'Жаба',k:'heal'})}}
}
function legalTargets(att){
 const L=locate(att.uid);if(!L)return[];
 const d=D[att.id],opp=1-L.p,ranged=has(d,'Дальнобой'),ws=ranged?[...Array(NW).keys()]:[L.w],out=[];
 ws.forEach(tw=>{const cs=G.board[opp][tw].filter(Boolean);
  if(!cs.length){if(tw===L.w)out.push({face:true,w:tw});return}
  const pr=cs.filter(isPrio);((!ranged&&pr.length)?pr:cs).forEach(c=>out.push({uid:c.uid}))});
 return out;
}
const canAct=(c,p)=>G.turn===p&&!c.sick&&!c.attacked&&c.atk>0;
function spellTargets(p,d){
 const opp=1-p;
 if(d.target==='enemy'){const out=[];G.board[opp].forEach(f=>{const cs=f.filter(Boolean),pr=cs.filter(isPrio);(pr.length?pr:cs).forEach(c=>out.push(c.uid))});return out}
 if(d.target==='enemyAny')return cardsOf(opp).filter(x=>D[x.c.id].r!=='legend').map(x=>x.c.uid);
 if(d.target==='own')return cardsOf(p).map(x=>x.c.uid);
 if(d.target==='copy')return[...cardsOf(0),...cardsOf(1)].filter(x=>D[x.c.id].r!=='legend'&&x.c.id!=='frog').map(x=>x.c.uid);
 return[];
}
function damage(c,n,killer){const d=D[c.id],eff=Math.max(0,n-kwN(d,'Щит')),before=c.hp;c.hp-=eff;fx.push({uid:c.uid,t:'−'+eff});if(c.hp<=0)death(c,killer);return{eff,over:Math.max(0,eff-before)}}
function death(c,killer){
 const d=D[c.id];
 if(has(d,'Стойкость')&&!c.stoykUsed){c.stoykUsed=true;c.hp=1;fx.push({uid:c.uid,t:'Стойкость',k:'heal'});say(c.owner,`${d.name} выстоял на 1 ХП.`);return}
 const L=locate(c.uid);if(L)G.board[L.p][L.w][L.s]=null;
 if(!d.token)G.discard.push(c.id);
 if(killer!=null&&killer!==c.owner){addCoins(killer,d.reward);G.stats.kills[killer]++;say(killer,`${d.name} погиб. ${who(killer)} получает ${coins(d.reward)}.`);if(d.reward)fx.push({face:killer,t:'+'+d.reward,k:'gold',coin:true})}
}
function hitFace(p,n,src){G.hp[p]-=n;say(1-p,`${src} бьёт по жизням: ${who(p)} −${n}.`);fx.push({face:p,t:'−'+n});checkEnd()}
function attack(att,tgt){
 const p=att.owner,opp=1-p,d=D[att.id];att.attacked=true;
 if(tgt.face)hitFace(opp,att.atk,d.name);
 else{const t=locate(tgt.uid);if(!t)return;const tc=t.c;
  if(has(d,'Пожирает')&&tc.hp<=3){say(p,`${d.name} пожирает ${D[tc.id].name}.`);fx.push({uid:tc.uid,t:'Съеден'});tc.stoykUsed=true;death(tc,p)}
  else{say(p,`${d.name} бьёт ${D[tc.id].name}.`);const r=damage(tc,att.atk,p);
   if(has(d,'Яд')&&locate(tc.uid))tc.poison=Math.max(tc.poison,kwN(d,'Яд'));
   if(has(d,'Таран')&&r.over>0)hitFace(opp,r.over,d.name)}}
 if(has(d,'Кровь')&&!G.over){const n=kwN(d,'Кровь');G.hp[opp]-=n;G.hp[p]=Math.min(G.maxHp,G.hp[p]+n);fx.push({face:opp,t:'−'+n});say(p,`${d.name} пьёт кровь.`);checkEnd()}
}
function cast(p,hi,uid){
 const h=G.hand[p][hi],d=D[h.id],opp=1-p;
 G.coins[p]-=d.cost;G.stats.spent[p]+=d.cost;G.hand[p].splice(hi,1);G.discard.push(h.id);
 const t=uid?locate(uid):null;
 if(d.id==='fire'){say(p,`${who(p)}: Огненный шар в ${D[t.c.id].name}.`);damage(t.c,3,p)}
 if(d.id==='krov'){G.hp[opp]-=2;G.hp[p]=Math.min(G.maxHp,G.hp[p]+2);fx.push({face:opp,t:'−2'},{face:p,t:'+2',k:'heal'});say(p,`${who(p)}: Глоток крови.`);checkEnd()}
 if(d.id==='istoch'){const was=t.c.hp;t.c.hp=Math.min(t.c.maxHp,t.c.hp+4);t.c.poison=0;fx.push({uid:t.c.uid,t:'+'+(t.c.hp-was),k:'heal'});say(p,`${who(p)}: Святой источник.`)}
 if(d.id==='znamya'){t.c.tempPrio=true;say(p,`${who(p)}: Знамя над ${D[t.c.id].name}.`)}
 if(d.id==='koshel'){draw(p);addCoins(p,1);say(p,`${who(p)}: Кошель, +1 карта и +1 монета.`)}
 if(d.id==='poglot'){say(p,`${who(p)}: Омут поглощает ${D[t.c.id].name}.`);t.c.stoykUsed=true;death(t.c,p)}
}
const upCost=c=>c.id==='svyat'?1:2;
const canUp=(p,c)=>G.turn===p&&!c.upgTurn&&c.upg<3&&G.coins[p]>=upCost(c)&&c.atk>0;
function upgrade(p,c){const k=upCost(c);G.coins[p]-=k;G.stats.spent[p]+=k;c.atk++;c.upg++;c.upgTurn=true;fx.push({uid:c.uid,t:'+1',k:'gold'});say(p,`${who(p)}: закалка ${D[c.id].name}.`)}
function checkEnd(){if(G.over)return;if(G.hp[0]<=0||G.hp[1]<=0){G.over=G.hp[1]<=0&&G.hp[0]>0?'win':'lose';setTimeout(()=>{screen='result';render()},900)}}
function startTurn(p){
 if(G.over)return;
 G.turn=p;G.turnNo[p]++;G.burned=0;G.mode=null;
 if(G.drain){G.hp[p]-=1;checkEnd()}
 draw(p);addCoins(p,income(G.turnNo[p]));
 cardsOf(p).forEach(({c,w,s})=>{c.sick=false;c.attacked=false;c.tempPrio=false;c.upgTurn=false;const d=D[c.id];
  if(has(d,'Жадность'))addCoins(p,kwN(d,'Жадность'));
  if(has(d,'Лекарь')){const n=G.board[p][w][1-s];if(n&&n.hp<n.maxHp){const was=n.hp;n.hp=Math.min(n.maxHp,n.hp+kwN(d,'Лекарь'));fx.push({uid:n.uid,t:'+'+(n.hp-was),k:'heal'})}}});
 cardsOf(p).forEach(({c})=>{if(c.poison)damage(c,c.poison+kwN(D[c.id],'Щит'),1-p)});
 if(p===0)lastBot='';
 render();
 if(p===1&&!G.over)botTurn();
}
async function botTurn(){
 busy=true;lastBot='Бот думает…';render();await sleep(800);const p=1;
 for(let k=0;k<6&&!G.over;k++){
  const opts=G.hand[p].map((h,i)=>({h,i,d:D[h.id]})).filter(x=>x.d.type==='c'&&x.d.cost<=G.coins[p]).sort((a,b)=>b.d.cost-a.d.cost);
  let best=null;
  for(const o of opts){for(let w=0;w<NW;w++)for(let s=0;s<2;s++){if(!canPlace(p,w,s,o.h.id).ok)continue;
   const my=G.board[p][w].filter(Boolean).length,en=G.board[0][w].filter(Boolean).length;
   const sc=o.d.cost*2+(my===0?(en?6:3):0)+(en?2:0)+Math.random();if(!best||sc>best.sc)best={o,w,s,sc}} if(best)break}
  if(!best)break;
  G.coins[p]-=best.o.d.cost;G.stats.spent[p]+=best.o.d.cost;G.hand[p].splice(best.o.i,1);place(p,best.w,best.s,best.o.h.id);render();await sleep(650);
 }
 for(let k=0;k<3&&!G.over;k++){let did=false;
  for(let i=0;i<G.hand[p].length;i++){const d=D[G.hand[p][i].id];if(d.type!=='s'||d.cost>G.coins[p])continue;let t=null;
   if(d.id==='fire'){t=spellTargets(p,d).map(u=>locate(u).c).filter(c=>c.hp<=Math.max(0,3-kwN(D[c.id],'Щит'))).sort((a,b)=>D[b.id].reward-D[a.id].reward)[0];if(!t)continue}
   else if(d.id==='poglot'){t=spellTargets(p,d).map(u=>locate(u).c).sort((a,b)=>D[b.id].cost-D[a.id].cost)[0];if(!t||D[t.id].cost<4)continue}
   else if(d.id==='istoch'){t=cardsOf(p).map(x=>x.c).find(c=>c.maxHp-c.hp>=3);if(!t)continue}
   else if(d.id==='koshel'){if(G.hand[p].length>6)continue}
   else if(d.id!=='krov')continue;
   cast(p,i,t&&t.uid);render();await sleep(700);did=true;break}
  if(!did)break}
 const up=cardsOf(p).map(x=>x.c).filter(c=>canUp(p,c)&&!c.sick).sort((a,b)=>b.atk-a.atk)[0];
 if(up&&G.coins[p]>=upCost(up)+1){upgrade(p,up);render();await sleep(500)}
 for(const {c} of cardsOf(p)){if(G.over)break;if(!locate(c.uid)||!canAct(c,p))continue;
  const ts=legalTargets(c);if(!ts.length)continue;let pick;
  const kills=ts.filter(t=>!t.face).map(t=>locate(t.uid).c).filter(t=>Math.max(0,c.atk-kwN(D[t.id],'Щит'))>=t.hp||(has(D[c.id],'Пожирает')&&t.hp<=3)).sort((a,b)=>D[b.id].reward-D[a.id].reward);
  const face=ts.find(t=>t.face);
  if(kills.length&&(D[kills[0].id].reward>0||!face))pick={uid:kills[0].uid};else if(face)pick=face;else pick={uid:ts.map(t=>locate(t.uid).c).sort((a,b)=>a.hp-b.hp)[0].uid};
  G.mode={kind:'botatk',uid:c.uid};render();await sleep(450);attack(c,pick);G.mode=null;render();await sleep(650)}
 busy=false;if(!G.over)startTurn(0);
}

 const m=G.mode;if(m&&m.err)return['bad',m.err];
 if(!m)return['',lastBot&&G.turnNo[0]<=1?'Тяни карту из руки в мир. Карту с золотой рамкой нажми, чтобы атаковать. Долгое нажатие переворачивает карту.':'Твой ход. Тяни карту в мир или атакуй картой с золотой рамкой.'];
 if(m.kind==='hand'){const d=D[G.hand[0].find(h=>h.hid===m.hid).id];
  if(d.type==='c')return['',`${d.name}: брось в мир. Золотом подсвечены свободные места.`];

 return['',''];
}

}
function rulesHTML(){return `<div class="head">${back(G&&!G.over&&rulesFromGame?'game':'menu')}<h2>Как играть</h2></div><div class="rules">
 <div class="frame rule"><h3>Об игре</h3><p>Омут — карточная дуэль против бота. Твари из славянских сказок, шесть миров, монеты за каждую убитую карту. Сведи жизни соперника к нулю.</p></div>
 <div class="frame rule"><h3>Стол</h3><p>Сверху поле соперника и его рука рубашкой вверх. Снизу твои 4 мира и рука. Мир стоит напротив мира. В каждом мире 2 места. Значок в углу мира показывает его родной класс.</p></div>
 <div class="frame rule"><h3>Кого можно поставить</h3><p>Первую карту можно поставить в любой мир. Пара в одном мире:</p><ul><li>можно два существа одного класса;</li><li>можно существо родного класса мира и любое другое;</li><li>нельзя два разных чужих класса.</li></ul><p>В Омуте родного класса нет: там пара только одного класса.</p></div>
 <div class="frame rule"><h3>Управление</h3><ul><li>Тяни карту из руки пальцем и бросай в мир или на цель.</li><li>Можно и нажатием: нажми карту в руке, потом место.</li><li>Нажми своё существо с золотой рамкой, потом цель, чтобы атаковать.</li><li>Долгое нажатие на любую карту переворачивает её: там описание, умения и награда за убийство.</li></ul></div>
 <div class="frame rule"><h3>Ход</h3><ul><li>В начале хода берёшь карту и получаешь доход: 2 монеты на ходах 1–2, дальше 3, 4 и с 7-го хода 5. Копилка до 10.</li><li>Ставь существ, играй чары, закаляй, сжигай лишнее (+1 монета, до 2 раз за ход).</li><li>Поставленное существо атакует со следующего хода, если у него нет Рывка.</li></ul></div>
 <div class="frame rule"><h3>Атака</h3><p>Существо бьёт карту в мире напротив. Если там пусто, удар идёт в жизни соперника, пока он не закроет этот мир. Защитник с Приоритетом прикрывает соседа.</p></div>
 <div class="frame rule"><h3>Монеты за убийство</h3><p>Сколько дают за карту, написано на её обороте: от 0 до 5 монет. Мелкие защитники стоят 0.</p></div>
 <div class="frame rule"><h3>Подглядывание</h3><p>В будущих версиях появятся карты, которые показывают руку соперника или верх Омута.</p></div>
 <div class="frame rule"><h3>Подсказки</h3><ul><li>Не оставляй мир пустым напротив врага: закрой его хоть дешёвой картой.</li><li>Добивай карты с высокой наградой: монеты решают партию.</li><li>Копи под легендарку, но помни, что копилка вмещает 10.</li></ul></div>
 </div>`}
let rulesFromGame=false;

// ===== эффекты =====
function runFx(){const list=fx;fx=[];list.forEach(f=>{const el=f.face!=null?document.getElementById('face'+f.face):document.querySelector(`.card[data-uid="${f.uid}"]`);if(!el)return;
 if(f.face==null)el.classList.add('hit');const s=document.createElement('span');s.className='fx '+(f.k||'');s.textContent=f.t;
 const host=f.face!=null?el:el.parentElement;if(f.face==null){host.style.position='relative'}host.appendChild(s);setTimeout(()=>{s.remove();el.classList.remove('hit')},1000)})}

// ===== окно карты =====
function openCard(defId,uid){
 const inst=uid?(locate(+uid)||{}).c:null;
 modal.innerHTML=`<div class="modal" data-close="1"><div class="box">${flipHTML(D[defId],inst,'mflip')}<p class="mhint">Нажми на карту, чтобы перевернуть</p><div class="mbtns"><button class="pbtn" data-act="mflip">Перевернуть</button><button class="pbtn" data-close="1">Закрыть</button></div></div></div>`;
 setTimeout(()=>{const f=document.getElementById('mflip');if(f)f.classList.add('on')},60);
}
function sheet(html){modal.innerHTML=`<div class="modal" data-close="1"><div class="frame sheet">${html}</div></div>`}

// ===== действия игрока =====
function err(t){G.mode=Object.assign({},G.mode||{},{err:t});render();setTimeout(()=>{if(G&&G.mode&&G.mode.err===t){delete G.mode.err;render()}},2600)}
const hIdx=hid=>G.hand[0].findIndex(h=>h.hid===hid);
function tryPlace(hid,w,s){const i=hIdx(hid);if(i<0)return;const id=G.hand[0][i].id,d=D[id],r=canPlace(0,w,s,id);
 if(!r.ok)return err(r.why);if(d.cost>G.coins[0])return err(`Не хватает монет: ${d.name} стоит ${d.cost}, у тебя ${G.coins[0]}.`);
 G.coins[0]-=d.cost;G.stats.spent[0]+=d.cost;G.hand[0].splice(i,1);G.mode=null;place(0,w,s,id);render()}
function trySpell(hid,uid){const i=hIdx(hid);if(i<0)return;const d=D[G.hand[0][i].id];
 if(d.cost>G.coins[0])return err(`Не хватает монет: ${d.name} стоит ${d.cost}.`);
 if(d.target==='none'){G.mode=null;cast(0,i);render();return}
 if(uid==null||!spellTargets(0,d).includes(uid))return err(d.target==='enemy'?'Эта цель закрыта защитником с Приоритетом.':'Эта цель не подходит.');
 if(d.target==='copy'){const cid=locate(uid).c.id;let any=false;for(let w=0;w<NW;w++)for(let s=0;s<2;s++)if(canPlace(0,w,s,cid).ok)any=true;
  if(!any)return err(`Для копии ${D[cid].name} нет места по правилу класса.`);G.mode={kind:'copyPlace',id:cid,hid};render();return}
 G.mode=null;cast(0,i,uid);render()}
function tryCopy(w,s){const m=G.mode,r=canPlace(0,w,s,m.id);if(!r.ok)return err(r.why);const i=hIdx(m.hid);
 G.coins[0]-=5;G.stats.spent[0]+=5;G.discard.push(G.hand[0][i].id);G.hand[0].splice(i,1);const id=m.id;G.mode=null;place(0,w,s,id,true);render()}

// ===== перетаскивание и долгое нажатие =====
let drag=null,press=null,suppress=false;
document.addEventListener('pointerdown',e=>{
 if(e.button>0)return;
 const card=e.target.closest('.card');
 if(card&&!e.target.closest('.modal')&&!e.target.closest('.menufan')){
  press={x:e.clientX,y:e.clientY,t:setTimeout(()=>{press&&(press.fired=true);drag=null;openCard(card.dataset.def,card.dataset.uid)},480)}}
 const hc=e.target.closest('.hc');
 if(hc&&screen==='game'&&G.turn===0&&!busy&&!G.over)drag={hid:+hc.dataset.hid,x:e.clientX,y:e.clientY,on:false};
});
document.addEventListener('pointermove',e=>{
 if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>9){clearTimeout(press.t);press=null}
 if(!drag)return;
 if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){
  drag.on=true;G.mode={kind:'hand',hid:drag.hid};render();
  const d=D[G.hand[0][hIdx(drag.hid)].id];drag.g=document.createElement('div');drag.g.className='ghost';drag.g.innerHTML=cardFront(d,null);document.body.appendChild(drag.g);
  const hc=document.querySelector(`.hc[data-hid="${drag.hid}"]`);if(hc)hc.style.opacity='.25'}
 if(drag.on){drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';e.preventDefault()}
},{passive:false});
document.addEventListener('pointerup',e=>{
 if(press){clearTimeout(press.t);if(press.fired)suppress=true;press=null}
 if(drag&&drag.on){
  drag.g.remove();const el=document.elementFromPoint(e.clientX,e.clientY),hid=drag.hid;drag=null;suppress=true;
  const d=D[G.hand[0][hIdx(hid)].id];
  if(d.type==='c'){const pl=el&&el.closest('[data-place]');if(pl){const [w,s]=pl.dataset.place.split('-').map(Number);tryPlace(hid,w,s)}else{render()}}
  else{const c=el&&el.closest('.card[data-uid]');if(d.target==='none'&&el&&el.closest('.board'))trySpell(hid);else if(c)trySpell(hid,+c.dataset.uid);else render()}
  return}
 drag=null;
});
document.addEventListener('contextmenu',e=>{const c=e.target.closest('.card');if(c&&!e.target.closest('.modal')){e.preventDefault();openCard(c.dataset.def,c.dataset.uid)}});

// ===== нажатия =====
document.addEventListener('click',e=>{
 if(suppress){suppress=false;return}
 const t=e.target;
 if(t.closest('.modal')){
  if(t.closest('[data-act="mflip"]')||t.closest('#mflip')){document.getElementById('mflip').classList.toggle('on');return}
  if(t.closest('[data-act="surr"]')){modal.innerHTML='';G.over='lose';screen='result';render();return}
  if(t.closest('[data-act="tomenu"]')){modal.innerHTML='';G.over=G.over||'lose';screen='menu';render();return}
  if(t.closest('[data-act="torules"]')){modal.innerHTML='';rulesFromGame=true;screen='rules';render();return}
  if(t.matches('[data-close]')||t.closest('button[data-close]'))modal.innerHTML='';return}
 const go=t.closest('[data-go]');
 if(go){const g=go.dataset.go;
  if(g==='toss'){newGame();screen='toss';render();setTimeout(()=>{const c=document.getElementById('coin');if(!c)return;c.textContent=G.first===0?'Ты':'Бот';document.getElementById('tossRes').textContent=G.first===0?'Первым ходишь ты':'Первым ходит Бот';document.getElementById('tossNext').hidden=false},1450);return}
  if(g==='rules')rulesFromGame=false;
  screen=g;render();if(g==='game'&&G.turn===1&&!busy&&!G.over)botTurn();return}
 const op=t.closest('[data-open]');if(op){openCard(op.dataset.def);return}
 const fl=t.closest('[data-filter]');if(fl){bestFilter=fl.dataset.filter;render();return}
 const mu=t.closest('[data-mull]');if(mu){const id=+mu.dataset.mull,i=G.marks.indexOf(id);i<0?G.marks.push(id):G.marks.splice(i,1);render();return}
 const act=t.closest('[data-act]');
 if(act){const a=act.dataset.act;
  if(a==='hp-'){startHp=Math.max(10,startHp-5);render();return}
  if(a==='hp+'){startHp=Math.min(40,startHp+5);render();return}
  if(a==='mull-go'){const keep=G.hand[0].filter(h=>!G.marks.includes(h.hid)),out=G.hand[0].filter(h=>G.marks.includes(h.hid));G.hand[0]=keep;out.forEach(h=>G.deck.push(h.id));shuffle(G.deck);out.forEach(()=>draw(0,true));G.marks=[];screen='game';startTurn(G.first);return}
  if(a==='settings'){sheet(`<h3>Пауза</h3><p class="muted">Миры на столе: ${G.worlds.map(k=>WORLDS[k].name+' — '+(WORLDS[k].cls||'любой')).join(', ')}.</p><button class="pbtn" data-act="torules">Как играть</button><button class="pbtn" data-close="1">Продолжить</button>`);return}
  if(a==='exit'){sheet(`<h3>Выйти из партии?</h3><p class="muted">Партия засчитается как поражение.</p><button class="pbtn gold" data-act="surr">Сдаться</button><button class="pbtn" data-close="1">Остаться</button>`);return}
  if(G.turn!==0||busy||G.over)return;
  if(a==='end'){G.mode=null;startTurn(1);return}
  if(a==='cancel'){G.mode=null;render();return}
  if(a==='upgrade'){G.mode=G.mode&&G.mode.kind==='upgrade'?null:{kind:'upgrade'};render();return}
  if(a==='burn'){const i=hIdx(G.mode.hid);if(i<0||G.burned>=2)return;G.discard.push(G.hand[0].splice(i,1)[0].id);G.burned++;addCoins(0,1);G.mode=null;render();return}
  if(a==='cast'){trySpell(G.mode.hid);return}
 }
 if(screen!=='game'||!G||G.turn!==0||busy||G.over)return;
 const m=G.mode||{};
 const hc=t.closest('[data-hid]');if(hc){const hid=+hc.dataset.hid;G.mode=(m.kind==='hand'&&m.hid===hid)?null:{kind:'hand',hid};render();return}
 const pl=t.closest('[data-place]');
 if(pl){const [w,s]=pl.dataset.place.split('-').map(Number);
  if(m.kind==='hand')return tryPlace(m.hid,w,s);if(m.kind==='copyPlace')return tryCopy(w,s);return}
 const fc=t.closest('[data-face]');if(fc&&m.kind==='attack'){const c=locate(m.uid).c;G.mode=null;attack(c,{face:true});render();return}
 const bc=t.closest('.card[data-uid]');
 if(bc){const uid=+bc.dataset.uid,side=+bc.dataset.side,L=locate(uid);if(!L)return;
  if(m.kind==='hand'&&D[G.hand[0][hIdx(m.hid)].id].type==='s')return trySpell(m.hid,uid);
  if(m.kind==='upgrade'&&side===0){if(!canUp(0,L.c))return err(L.c.upgTurn?'Эту карту уже закаляли в этот ход.':L.c.upg>=3?'Больше 3 закалок нельзя.':'Не хватает монет на закалку.');upgrade(0,L.c);G.mode=null;render();return}
  if(m.kind==='attack'&&side===1){const att=locate(m.uid).c;if(!legalTargets(att).some(x=>x.uid===uid))return err('Сюда нельзя: бей мир напротив, а если там Приоритет — только его.');G.mode=null;attack(att,{uid});render();return}
  if(side===0){if(canAct(L.c,0)){G.mode=m.kind==='attack'&&m.uid===uid?null:{kind:'attack',uid};render()}
   else err(L.c.atk<=0?`${D[L.c.id].name} не атакует.`:L.c.sick?`${D[L.c.id].name} ударит со следующего хода.`:`${D[L.c.id].name} уже атаковал.`);return}
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(modal.innerHTML){modal.innerHTML='';return}if(G&&G.mode){G.mode=null;render()}}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}
 if(e.key==='i'&&document.activeElement&&document.activeElement.closest('.card')){const c=document.activeElement.closest('.card');openCard(c.dataset.def,c.dataset.uid)}
});

// ===== запуск =====
function start(data){
 if(data&&data.G){G=data.G;screen=data.screen;uidN=data.uidN;startHp=data.startHp||25;busy=false}
 render();
 buildArt().then(()=>{render();if(screen==='game'&&G&&G.turn===1&&!G.over&&!busy)botTurn()});
}
window.claude?.hot?.snapshot?.(()=>({G,screen:screen==='toss'?'menu':screen,uidN,startHp}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
