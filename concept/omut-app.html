<title>Омут</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Раскладка: экраны-слои (меню, жребий, замена карт, стол, итог, бестиарий, правила). Стол: соперник сверху, 5 миров напротив 5, твоя рука снизу, журнал справа.
   Одна тёмная тема по замыслу: торфяная вода и бронза. Акцент один — бронза монет; красный только для жизней и угрозы. */
:root{
  color-scheme: dark;
  --bg:#121613; --table:#192019; --panel:#212822; --panel2:#2a322b; --line:#364038;
  --ink:#ece5d1; --muted:#a3a08c; --dim:#6f7466;
  --brass:#d0a74d; --brass-ink:#2a1e08; --blood:#c2493e; --poison:#8fbf5a;
  --r-common:#8d8c82; --r-rare:#4a8bb5; --r-epic:#a83d4d; --r-legend:#d8b052;
  --f-display:"Ruslan Display","Alegreya",Georgia,serif;
  --f-card:"Alegreya",Georgia,"Times New Roman",serif;
  --f-ui:"Alegreya Sans","Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;padding:0 16px;}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3,p{margin:0}
.screen{max-width:1400px;margin:0 auto;padding-block:16px 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:700;transition:border-color .15s,transform .15s var(--ease)}
.btn:hover{border-color:var(--brass)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.topnav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo-s{font-family:var(--f-display);font-size:28px;line-height:1}
.h2{font-family:var(--f-card);font-weight:800;font-size:28px;text-wrap:balance}

/* ---------- меню ---------- */
.menu{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;min-height:560px}
@media (max-width:860px){.menu{grid-template-columns:1fr;min-height:0}}
.menu .logo{font-family:var(--f-display);font-size:clamp(64px,12vw,148px);line-height:.9;letter-spacing:.02em}
.menu .slogan{font-family:var(--f-card);font-style:italic;font-size:22px;color:var(--muted);margin-top:14px}
.menu .lead{max-width:52ch;margin-top:22px;font-size:17px;color:var(--ink)}
.menu .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.menu .acts .primary{min-height:52px;padding:0 30px;font-size:18px}
.setting{display:flex;align-items:center;gap:10px;margin-top:18px;color:var(--muted);font-size:14px}
.setting select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.fan{position:relative;height:420px}
.fan .card{box-shadow:0 18px 40px rgba(0,0,0,.55)}
@media (max-width:860px){.fan{height:330px;transform:scale(.78)}}

/* ---------- жребий и замена ---------- */
.center{display:grid;justify-items:center;gap:18px;text-align:center;padding-block:40px}
.coinbig{width:150px;height:150px;border-radius:50%;background:var(--brass);color:var(--brass-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:30px;box-shadow:inset 0 0 0 8px rgba(42,30,8,.25),0 20px 40px rgba(0,0,0,.5)}
.coinbig.spin{animation:spin 1.4s var(--ease)}
@keyframes spin{0%{transform:rotateY(0) translateY(0)}40%{transform:rotateY(900deg) translateY(-60px)}100%{transform:rotateY(1800deg) translateY(0)}}
.toss-res{font-family:var(--f-card);font-size:26px;font-weight:800;min-height:1.4em}
.mull{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mull .pick{position:relative;width:132px}
.mull .pick.marked .card{opacity:.35}
.mull .pick.marked::after{content:"Заменить";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:var(--blood);color:#fff;font-weight:800;font-size:13px;padding:3px 8px;border-radius:4px}
.muted{color:var(--muted)}

/* ---------- стол ---------- */
.game{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
@media (max-width:1150px){.game{grid-template-columns:minmax(0,1fr)}}
.table{background:var(--table);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0}
.pbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pbar .who{font-family:var(--f-card);font-weight:800;font-size:18px}
.pbar .turnflag{font-size:13px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--brass);color:var(--brass-ink)}
.pbar .sp{flex:1}
.stat{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.stat svg{width:20px;height:20px}
.stat.hp{color:#e6847a}.stat.coin{color:var(--brass)}
.stat .lbl{font-weight:500;font-size:13px;color:var(--muted)}
.handback{display:flex;gap:3px}
.handback i{width:14px;height:20px;border-radius:2px;background:#0f1717;border:1px solid #2f4446}
.scroller{overflow-x:auto;padding-bottom:4px}
.row{display:grid;grid-template-columns:repeat(5,minmax(168px,1fr));gap:10px;min-width:880px}
.world{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:8px;overflow:hidden;border:1px solid color-mix(in srgb,var(--w) 40%,transparent);background:var(--wbg)}
.world .scene{position:absolute;inset:0;opacity:.6}
.world .scene svg{width:100%;height:100%;display:block}
.world .wico{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid color-mix(in srgb,var(--w) 60%,transparent);color:var(--w);display:grid;place-items:center;z-index:2}
.world .wico svg{width:18px;height:18px}
.slots{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 8px 26px;height:100%;align-content:center}
.slot{aspect-ratio:5/7;max-width:100%;border:1px dashed color-mix(in srgb,var(--w) 45%,transparent);border-radius:6px;background:rgba(0,0,0,.25);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:700;color:var(--dim);padding:4px}
.slot.can{border:2px solid var(--brass);background:rgba(208,167,77,.14);color:var(--brass);cursor:pointer}
.slot.face{border:2px solid var(--blood);background:rgba(194,73,62,.18);color:#f0a198;cursor:pointer;animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:rgba(194,73,62,.32)}}
.midline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 10px;border-block:1px solid var(--line)}
.pile{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pile b{display:block;color:var(--ink);font-family:var(--f-card);font-size:15px}
.deck{width:38px;height:54px;border-radius:4px;background:#0e1515;border:1px solid #2f4446;display:grid;place-items:center;color:#7fb3ad}
.deck svg{width:22px;height:22px}
.hint{flex:1 1 260px;min-width:0;text-align:center;font-size:15px}
.hint.bad{color:#f0a198}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions .sp{flex:1}
.btn.mode-on{border-color:var(--brass);background:rgba(208,167,77,.16)}
.hand{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 6px;min-height:170px}
.hand .card{width:112px;flex:none;transition:transform .15s var(--ease)}
.hand .card:hover{transform:translateY(-6px)}
.hand .card.unaff{filter:saturate(.4) brightness(.7)}
.side{display:grid;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.panel h3{font-family:var(--f-card);font-size:17px;margin-bottom:8px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;max-height:420px;overflow:auto}
.log li{padding-left:10px;border-left:2px solid var(--line)}
.log li.me{border-color:var(--brass)}.log li.bot{border-color:var(--blood)}
.legend{display:grid;gap:6px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend svg{width:18px;height:18px;flex:none}

/* ---------- карта ---------- */
.card{--rar:var(--r-common);position:relative;display:block;width:100%;aspect-ratio:5/7;max-width:100%;border-radius:7px;border:2px solid var(--rar);background:#0c0e0d;overflow:hidden;font-family:var(--f-card);text-align:left;color:var(--ink);container-type:inline-size;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.card[data-r="rare"]{--rar:var(--r-rare)}.card[data-r="epic"]{--rar:var(--r-epic)}.card[data-r="legend"]{--rar:var(--r-legend)}
.card .art{position:absolute;inset:0}
.card .art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.card .tl,.card .tr{position:absolute;top:4%;display:grid;gap:4%;width:24%;z-index:2}
.card .tl{left:4%}.card .tr{right:4%;justify-items:end}
.badge{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--f-ui);font-weight:800;font-size:13cqi;line-height:1;font-variant-numeric:tabular-nums}
.badge.cost{background:var(--brass);color:var(--brass-ink);font-size:15cqi}
.badge.bounty{background:rgba(10,10,10,.82);border:1px solid var(--brass);color:var(--brass);position:relative}
.badge.bounty svg{position:absolute;width:40%;height:40%;top:-14%;left:-10%;color:var(--ink)}
.badge.cls{background:rgba(10,10,10,.7);color:var(--cw)}
.badge.cls svg{width:62%;height:62%}
.badge.prio{background:var(--ink);color:#1a1a1a}
.badge.prio svg{width:60%;height:60%}
.card .name{position:absolute;left:0;right:0;bottom:17%;padding:2% 5%;background:rgba(8,9,8,.78);font-weight:800;font-size:10.5cqi;line-height:1.1;z-index:2}
.card .foot{position:absolute;left:0;right:0;bottom:0;height:17%;display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:rgba(8,9,8,.9);font-family:var(--f-ui);font-weight:800;font-size:13cqi;font-variant-numeric:tabular-nums;z-index:2}
.card .foot .atk{color:#f2c27c;display:flex;align-items:center;gap:3%}
.card .foot .hp{color:#ee8e84;display:flex;align-items:center;gap:3%}
.card .foot .hp.hurt{color:#ff5d4f}
.card .foot svg{width:12cqi;height:12cqi}
.card .foot .kind{font-weight:600;color:var(--muted);font-size:11cqi}
.flipbtn{width:20cqi;height:20cqi;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
.flipbtn svg{width:62%;height:62%}
.flipbtn:hover{border-color:var(--brass);color:var(--brass)}
.chips{position:absolute;left:4%;bottom:31%;display:flex;gap:4%;z-index:2}
.chip{font-family:var(--f-ui);font-weight:800;font-size:9cqi;padding:1px 4px;border-radius:3px;background:rgba(10,10,10,.85)}
.chip.poison{color:var(--poison)}.chip.sick{color:var(--muted)}.chip.up{color:var(--brass)}
.card.ready{border-color:var(--brass);box-shadow:0 0 0 2px rgba(208,167,77,.45)}
.card.sel{outline:3px solid var(--brass);outline-offset:2px}
.card.target{outline:3px solid var(--blood);outline-offset:2px;cursor:crosshair;animation:pulseo 1.1s infinite}
.card.ally-target{outline:3px solid var(--poison);outline-offset:2px;cursor:pointer}
@keyframes pulseo{50%{outline-color:#ff8a7e}}
.card.hit{animation:hit .35s}
@keyframes hit{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.fx{position:absolute;left:50%;top:35%;transform:translateX(-50%);font-family:var(--f-ui);font-weight:800;font-size:22px;color:#ff6b5e;text-shadow:0 2px 0 #000;pointer-events:none;animation:rise 1s forwards;z-index:5}
.fx.heal{color:var(--poison)}.fx.gold{color:var(--brass)}
@keyframes rise{to{transform:translate(-50%,-34px);opacity:0}}
@media (prefers-reduced-motion:reduce){.coinbig.spin,.slot.face,.card.target,.card.hit,.fx{animation:none}.hand .card{transition:none}.fx{display:none}}

/* оборот */
.back{position:absolute;inset:0;border-radius:5px;background:var(--panel);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.back .bhead{position:relative;padding:12px 14px 10px;background:var(--wbg);border-bottom:1px solid var(--line)}
.back .bhead .scene{position:absolute;inset:0;opacity:.35}
.back .bhead .scene svg{width:100%;height:100%}
.back .bhead h3{position:relative;font-family:var(--f-card);font-weight:800;font-size:20px;line-height:1.1}
.back .bhead p{position:relative;font-size:13px;color:var(--muted);margin-top:2px}
.back .bbody{padding:12px 14px;display:grid;gap:10px;align-content:start;overflow:auto}
.back dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.back dt{color:var(--muted)}.back dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.back .kws{display:flex;gap:6px;flex-wrap:wrap}
.back .kw{font-size:12px;font-weight:800;padding:2px 7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.back .desc{font-family:var(--f-card);font-size:15px;line-height:1.45}
.back .bounty-line{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;background:rgba(208,167,77,.1);color:var(--brass);font-weight:700;font-size:14px}
.back .bounty-line svg{width:18px;height:18px}

/* переворот */
.flip{perspective:1200px}
.flip .inner{position:relative;width:100%;aspect-ratio:5/7;transition:transform .6s var(--ease);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face-f,.flip .face-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .face-b{transform:rotateY(180deg);border:2px solid var(--rar);border-radius:7px;overflow:hidden}
.flip .face-b[data-r="rare"]{--rar:var(--r-rare)}.flip .face-b[data-r="epic"]{--rar:var(--r-epic)}.flip .face-b[data-r="legend"]{--rar:var(--r-legend)}.flip .face-b{--rar:var(--r-common)}
@media (prefers-reduced-motion:reduce){.flip .inner{transition:none}}

.modal{position:fixed;inset:0;z-index:50;background:rgba(5,7,6,.78);display:grid;place-items:center;padding:16px}
.modal .box{display:grid;justify-items:center;gap:14px}
.modal .flip{width:min(300px,78vw)}
.modal .row-btns{display:flex;gap:8px}

/* итог */
.result{display:grid;justify-items:center;gap:16px;text-align:center;padding-block:48px}
.result .big{font-family:var(--f-display);font-size:clamp(44px,8vw,88px);line-height:1}
.result .big.lose{color:#e6847a}
.result dl{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:10px;margin:8px 0 0}
@media (max-width:560px){.result dl{grid-template-columns:repeat(2,minmax(0,1fr))}}
.result dl div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.result dt{font-size:13px;color:var(--muted)}.result dd{margin:0;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}

/* бестиарий и правила */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters button{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:14px}
.filters button svg{width:16px;height:16px}
.filters button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.grid .flip{cursor:pointer}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:8px;align-content:start}
.rule h3{font-family:var(--f-card);font-size:19px}
.rule p,.rule li{font-size:15px;max-width:62ch}
.rule ul{margin:0;padding-left:18px;display:grid;gap:4px}
</style>

<div id="app"></div>
<div id="modal"></div>

<script>
(function(){
// ================= иконки =================

 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.3" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>',

 sword:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 3h1v3l-9.5 9.5-2.1-2.1L19 4ZM7.6 13.3l3.1 3.1-1.4 1.4-1-1-2.6 2.6.7.7-1.4 1.4-2.8-2.8 1.4-1.4.7.7 2.6-2.6-1-1Z"/></svg>',
 coin:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="currentColor"/><circle cx="12" cy="12" r="5.8" fill="none" stroke="#2a1e08" stroke-width="1.7" opacity=".55"/></svg>',
 shield:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5Z"/></svg>',
 flipi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 4v4h-4M20 15a8 8 0 0 1-14 3l-2-2M4 20v-4h4"/></svg>'
};
const CLASS_ICON={'Люди':'sun','Нежить':'skull','Нечисть':'eye','Чудища':'tent','Бесы':'flame'};
const CLASS_COLOR={'Люди':'#d6ad52','Нежить':'#a9bdb0','Нечисть':'#8fbb6c','Чудища':'#62a8d6','Бесы':'#e57c48'};

function cardFront(d,inst,o){
 o=o||{};
 const w=WORLDS[worldOf(d)];
 const clsIcon=d.type==='c'?I[CLASS_ICON[d.cls]]:I.rune;
 const cw=d.type==='c'?CLASS_COLOR[d.cls]:'#cfc6ad';
 const atk=inst?inst.atk:d.atk, hp=inst?inst.hp:d.hp;
 const prio=inst?isPrio(inst):has(d,'Приоритет');
 const chips=[];
 if(inst){if(inst.poison)chips.push(`<span class="chip poison">Яд</span>`);if(inst.sick&&!has(d,'Рывок'))chips.push(`<span class="chip sick">Ждёт</span>`);if(inst.upg)chips.push(`<span class="chip up">+${inst.upg}</span>`);}
 const foot=d.type==='c'
  ?`<span class="atk">${I.sword}${atk}</span>${o.noflip?'':flipBtn(d,inst)}<span class="hp${inst&&inst.hp<inst.maxHp?' hurt':''}">${I.heart}${hp}</span>`
  :`<span class="kind">Чары</span>${o.noflip?'':flipBtn(d,inst)}`;
 return `<div class="card ${o.cls||''}" data-r="${d.r}" ${o.attrs||''} style="--cw:${cw}" ${o.role?`role="button" tabindex="0"`:''} aria-label="${d.name}">
  <div class="art">${scene(worldOf(d))}<svg viewBox="0 0 200 280" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g fill="#0a0b0a" color="#0a0b0a" opacity=".9" transform="translate(0,46)">${SIL[d.sil]}</g></svg></div>
  <div class="tl"><span class="badge cost" title="Цена: ${coins(d.cost)}">${d.cost}</span>${d.type==='c'?`<span class="badge bounty" title="За убийство: ${coins(d.reward)}">${I.skull}${d.reward}</span>`:''}</div>
  <div class="tr"><span class="badge cls" title="${d.type==='c'?'Класс: '+d.cls:'Чары'}">${clsIcon}</span>${prio?`<span class="badge prio" title="Приоритет">${I.shield}</span>`:''}</div>
  ${chips.length?`<div class="chips">${chips.join('')}</div>`:''}
  <div class="name">${d.name}</div>
  <div class="foot">${foot}</div>
 </div>`;
}
function flipBtn(d,inst){return `<button class="flipbtn" data-flip="${d.id}" ${inst?`data-uid="${inst.uid}"`:''} aria-label="Перевернуть карту ${d.name}" title="Перевернуть">${I.flipi}</button>`}
function cardBack(d,inst){
 const w=WORLDS[worldOf(d)];
 const rows=[`<dt>Цена</dt><dd>${coins(d.cost)}</dd>`];
 if(d.type==='c'){
  rows.push(`<dt>Класс</dt><dd>${d.cls}</dd>`,`<dt>Родной мир</dt><dd>${w.name}</dd>`,`<dt>Урон</dt><dd>${inst?inst.atk:d.atk}${inst&&inst.upg?` (закалка +${inst.upg})`:''}</dd>`,`<dt>Здоровье</dt><dd>${inst?inst.hp+' из '+inst.maxHp:d.hp}</dd>`);
 } else rows.push(`<dt>Тип</dt><dd>Чары, разовое действие</dd>`);
 rows.push(`<dt>Метка</dt><dd>${d.mark}</dd>`,`<dt>Редкость</dt><dd>${R_NAME[d.r]}</dd>`);
 return `<div class="back" style="--wbg:${w.wbg}">

let G=null, screen='menu', uidN=1, busy=false, bestFilter='all', fx=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function newGame(startHp){
 const deck=[];DEFS.forEach(d=>{for(let i=0;i<COPIES[d.r];i++)deck.push(d.id)});shuffle(deck);
 G={worlds:shuffle(ORDER.slice()).slice(0,5),board:[0,1].map(()=>[0,1,2,3,4].map(()=>[null,null])),
  hand:[[],[]],deck,discard:[],hp:[startHp,startHp],maxHp:startHp+5,coins:[3,3],turn:0,turnNo:[0,0],first:Math.random()<.5?0:1,
  burned:0,mode:null,log:[],drain:false,over:null,stats:{kills:[0,0],earned:[0,0],spent:[0,0],turns:0},mullMarks:new Set()};
 for(let p=0;p<2;p++)for(let i=0;i<5;i++)draw(p,true);
 G.coins[1-G.first]+=1;
}
function draw(p,silent){
 if(!G.deck.length){if(!G.discard.length)return;G.deck=shuffle(G.discard.filter(id=>id!=='frog'));G.discard=[];G.drain=true;log(null,'Омут опустел и перемешан из Дна. Теперь каждый ход оба теряют по 1 жизни.');}
 const id=G.deck.pop(); if(!id)return;
 if(G.hand[p].length>=8){G.discard.push(id);if(!silent)log(p,`${who(p)}: рука полна, ${D[id].name} уходит на Дно.`);return;}
 G.hand[p].push({hid:uidN++,id});
}
function who(p){return p===0?'Ты':'Бот'}
function log(p,t){G.log.unshift({p,t});G.log=G.log.slice(0,40)}
function isPrio(c){return has(D[c.id],'Приоритет')||c.tempPrio}
function cardsOf(p){const r=[];G.board[p].forEach((w,wi)=>w.forEach((c,s)=>{if(c)r.push({c,w:wi,s})}));return r}
function locate(uid){for(let p=0;p<2;p++)for(let w=0;w<5;w++)for(let s=0;s<2;s++){const c=G.board[p][w][s];if(c&&c.uid===uid)return{p,w,s,c}}return null}
function income(n){return [2,2,3,3,4,4][n-1]||5}
function addCoins(p,n){const before=G.coins[p];G.coins[p]=Math.min(10,G.coins[p]+n);G.stats.earned[p]+=G.coins[p]-before}
function canPlace(p,w,s,id){
 const d=D[id];if(d.type!=='c')return{ok:false,why:'Чары не ставятся в мир.'};
 const f=G.board[p][w];if(f[s])return{ok:false,why:'Место занято.'};
 const wd=WORLDS[G.worlds[w]];
 if(wd.cls===null||d.cls===wd.cls)return{ok:true};
 const o=f[1-s];
 if(o&&D[o.id].cls===wd.cls)return{ok:true};
 if(o)return{ok:false,why:`Тут уже стоит ${D[o.id].name}. Два чужих класса в одном мире нельзя: нужен хотя бы один из класса ${wd.cls}.`};
 return{ok:false,why:`Это мир класса ${wd.cls}. ${d.name} (${d.cls}) может встать сюда только вторым, рядом с существом класса ${wd.cls}.`};
}
function makeInst(id,p){const d=D[id];return{uid:uidN++,id,owner:p,atk:d.atk,hp:d.hp,maxHp:d.hp,sick:!has(d,'Рывок'),attacked:false,poison:0,stoykUsed:false,tempPrio:false,upg:0,upgTurn:false}}
function place(p,w,s,id,isCopy){
 const inst=makeInst(id,p);G.board[p][w][s]=inst;
 log(p,`${who(p)}: ${isCopy?'копия — ':''}${D[id].name} встаёт в мир ${WORLDS[G.worlds[w]].name}.`);
 if(id==='yaga'){
  const t=cardsOf(1-p).filter(x=>D[x.c.id].r!=='legend'&&x.c.id!=='frog').sort((a,b)=>(b.c.atk+b.c.hp)-(a.c.atk+a.c.hp))[0];
  if(t){const old=D[t.c.id].name;const fr=makeInst('frog',1-p);fr.sick=false;G.board[1-p][t.w][t.s]=fr;log(p,`Баба-Яга превращает ${old} в Жабу.`);fx.push({uid:fr.uid,t:'Жаба',k:'heal'});}
 }
 return inst;
}
function legalTargets(att){
 const L=locate(att.uid);if(!L)return[];
 const d=D[att.id],opp=1-L.p,ranged=has(d,'Дальнобой');
 const ws=ranged?[0,1,2,3,4]:[L.w];const out=[];
 ws.forEach(tw=>{
  const cs=G.board[opp][tw].filter(Boolean);
  if(!cs.length){if(tw===L.w)out.push({face:true,w:tw});return;}
  const pr=cs.filter(isPrio);const list=(!ranged&&pr.length)?pr:cs;
  list.forEach(c=>out.push({uid:c.uid}));
 });
 return out;
}
function canAct(c,p){return G.turn===p&&!c.sick&&!c.attacked&&c.atk>0}
function spellTargets(p,d){
 const opp=1-p;
 if(d.target==='enemy'){const out=[];G.board[opp].forEach(f=>{const cs=f.filter(Boolean);const pr=cs.filter(isPrio);(pr.length?pr:cs).forEach(c=>out.push(c.uid))});return out}
 if(d.target==='enemyAny')return cardsOf(opp).filter(x=>D[x.c.id].r!=='legend').map(x=>x.c.uid);
 if(d.target==='own')return cardsOf(p).map(x=>x.c.uid);
 if(d.target==='copy')return[...cardsOf(0),...cardsOf(1)].filter(x=>D[x.c.id].r!=='legend'&&x.c.id!=='frog').map(x=>x.c.uid);
 return[];
}
function damage(c,n,killerP){
 const d=D[c.id];const sh=kwN(d,'Щит');const eff=Math.max(0,n-sh);const before=c.hp;
 c.hp-=eff;fx.push({uid:c.uid,t:'−'+eff});
 if(c.hp<=0)death(c,killerP);
 return{eff,overflow:Math.max(0,eff-before)};
}
function death(c,killerP){
 const d=D[c.id];
 if(has(d,'Стойкость')&&!c.stoykUsed){c.stoykUsed=true;c.hp=1;log(c.owner,`${d.name} выстоял на 1 ХП.`);fx.push({uid:c.uid,t:'Стойкость',k:'heal'});return}
 const L=locate(c.uid);if(L)G.board[L.p][L.w][L.s]=null;
 if(!d.token)G.discard.push(c.id);
 if(killerP!=null&&killerP!==c.owner){addCoins(killerP,d.reward);G.stats.kills[killerP]++;log(killerP,`${d.name} погиб. ${who(killerP)} получает ${coins(d.reward)}.`)}
 else log(c.owner,`${d.name} погиб.`);
}
function hitFace(p,n,src){G.hp[p]-=n;log(1-p,`${src} бьёт по жизням: ${who(p)} −${n}.`);fx.push({face:p,t:'−'+n});checkEnd()}
function attack(att,tgt){
 const p=att.owner,opp=1-p,d=D[att.id];
 att.attacked=true;
 if(tgt.face){hitFace(opp,att.atk,d.name)}
 else{
  const t=locate(tgt.uid);if(!t)return;const tc=t.c;
  if(has(d,'Пожирает')&&tc.hp<=3){log(p,`${d.name} пожирает ${D[tc.id].name}.`);fx.push({uid:tc.uid,t:'Съеден'});tc.hp=0;const st=tc.stoykUsed;tc.stoykUsed=true;death(tc,p);if(!st)tc.stoykUsed=st;}
  else{
   log(p,`${d.name} бьёт ${D[tc.id].name}.`);
   const r=damage(tc,att.atk,p);
   if(has(d,'Яд')&&locate(tc.uid))tc.poison=Math.max(tc.poison,kwN(d,'Яд'));
   if(has(d,'Таран')&&r.overflow>0)hitFace(opp,r.overflow,d.name+' (таран)');
  }
 }
 if(has(d,'Кровь')&&!G.over){const n=kwN(d,'Кровь');G.hp[opp]-=n;G.hp[p]=Math.min(G.maxHp,G.hp[p]+n);log(p,`${d.name} пьёт кровь: ${who(opp)} −${n}, ${who(p)} +${n}.`);fx.push({face:opp,t:'−'+n});checkEnd()}
}
function cast(p,hidx,targetUid){
 const h=G.hand[p][hidx],d=D[h.id];
 G.coins[p]-=d.cost;G.stats.spent[p]+=d.cost;G.hand[p].splice(hidx,1);G.discard.push(h.id);
 const opp=1-p;
 if(d.id==='fire'){const t=locate(targetUid);log(p,`${who(p)}: Огненный шар в ${D[t.c.id].name}.`);damage(t.c,3,p)}
 if(d.id==='krov'){G.hp[opp]-=2;G.hp[p]=Math.min(G.maxHp,G.hp[p]+2);log(p,`${who(p)}: Глоток крови. ${who(opp)} −2, ${who(p)} +2.`);fx.push({face:opp,t:'−2'});checkEnd()}
 if(d.id==='istoch'){const t=locate(targetUid);const was=t.c.hp;t.c.hp=Math.min(t.c.maxHp,t.c.hp+4);t.c.poison=0;fx.push({uid:t.c.uid,t:'+'+(t.c.hp-was),k:'heal'});log(p,`${who(p)}: Святой источник лечит ${D[t.c.id].name}.`)}
 if(d.id==='znamya'){const t=locate(targetUid);t.c.tempPrio=true;log(p,`${who(p)}: Знамя. ${D[t.c.id].name} получает Приоритет.`)}
 if(d.id==='koshel'){draw(p);addCoins(p,1);log(p,`${who(p)}: Кошель. +1 карта и +1 монета.`)}
 if(d.id==='poglot'){const t=locate(targetUid);log(p,`${who(p)}: Омут поглощает ${D[t.c.id].name}.`);t.c.stoykUsed=true;death(t.c,p)}
}
function upgradeCost(c){return c.id==='svyat'?1:2}
function upgrade(p,c){const cost=upgradeCost(c);G.coins[p]-=cost;G.stats.spent[p]+=cost;c.atk++;c.upg++;c.upgTurn=true;fx.push({uid:c.uid,t:'+1 урон',k:'gold'});log(p,`${who(p)}: закалка, ${D[c.id].name} получает +1 урон.`)}
function canUpgrade(p,c){return G.turn===p&&!c.upgTurn&&c.upg<3&&G.coins[p]>=upgradeCost(c)&&c.atk>0}
function checkEnd(){
 if(G.over)return;
 if(G.hp[0]<=0||G.hp[1]<=0){G.over=G.hp[1]<=0&&G.hp[0]>0?'win':'lose';setTimeout(()=>{screen='result';render()},900)}
}
function startTurn(p){
 if(G.over)return;
 G.turn=p;G.turnNo[p]++;G.burned=0;G.mode=null;G.stats.turns=Math.max(G.stats.turns,G.turnNo[0]);
 log(p,`Ход ${G.turnNo[p]}: ходит ${p===0?'ты':'Бот'}.`);
 if(G.drain){G.hp[p]-=1;log(p,`Омут затягивает: ${who(p)} −1 жизнь.`);checkEnd()}
 draw(p);addCoins(p,income(G.turnNo[p]));
 cardsOf(p).forEach(({c,w,s})=>{
  c.sick=false;c.attacked=false;c.tempPrio=false;c.upgTurn=false;
  const d=D[c.id];
  if(has(d,'Жадность'))addCoins(p,kwN(d,'Жадность'));
  if(has(d,'Лекарь')){const n=G.board[p][w][1-s];if(n&&n.hp<n.maxHp){const was=n.hp;n.hp=Math.min(n.maxHp,n.hp+kwN(d,'Лекарь'));fx.push({uid:n.uid,t:'+'+(n.hp-was),k:'heal'});log(p,`${d.name} лечит ${D[n.id].name}.`)}}
 });
 cardsOf(p).forEach(({c})=>{if(c.poison){log(p,`Яд: ${D[c.id].name} −${c.poison}.`);damage(c,c.poison+kwN(D[c.id],'Щит'),1-p)}});
 render();
 if(p===1&&!G.over)botTurn();
}
function endTurn(){if(G.turn!==0||busy||G.over)return;G.mode=null;startTurn(1)}

async function botTurn(){
 busy=true;render();await sleep(800);
 const p=1;
 // 1. существа
 for(let k=0;k<6&&!G.over;k++){
  const opts=G.hand[p].map((h,i)=>({h,i,d:D[h.id]})).filter(x=>x.d.type==='c'&&x.d.cost<=G.coins[p]).sort((a,b)=>b.d.cost-a.d.cost);
  let best=null;
  for(const o of opts){for(let w=0;w<5;w++)for(let s=0;s<2;s++){
   if(!canPlace(p,w,s,o.h.id).ok)continue;
   const myW=G.board[p][w].filter(Boolean).length,enemyW=G.board[0][w].filter(Boolean).length;
   const score=o.d.cost*2+(myW===0?(enemyW?6:3):0)+(enemyW?2:0)+(WORLDS[G.worlds[w]].cls===o.d.cls?1:0)+Math.random();
   if(!best||score>best.score)best={o,w,s,score};
  } if(best)break;}
  if(!best)break;
  G.coins[p]-=best.o.d.cost;G.stats.spent[p]+=best.o.d.cost;G.hand[p].splice(best.o.i,1);place(p,best.w,best.s,best.o.h.id);render();await sleep(650);
 }
 // 2. чары
 for(let k=0;k<3&&!G.over;k++){
  let did=false;
  for(let i=0;i<G.hand[p].length;i++){
   const d=D[G.hand[p][i].id];if(d.type!=='s'||d.cost>G.coins[p])continue;
   let tgt=null;
   if(d.id==='fire'){tgt=spellTargets(p,d).map(u=>locate(u).c).filter(c=>c.hp-Math.max(0,3-kwN(D[c.id],'Щит'))<=0).sort((a,b)=>D[b.id].reward-D[a.id].reward)[0];if(!tgt)continue}
   else if(d.id==='poglot'){tgt=spellTargets(p,d).map(u=>locate(u).c).sort((a,b)=>D[b.id].cost-D[a.id].cost)[0];if(!tgt||D[tgt.id].cost<4)continue}
   else if(d.id==='istoch'){tgt=cardsOf(p).map(x=>x.c).filter(c=>c.maxHp-c.hp>=3)[0];if(!tgt)continue}
   else if(d.id==='krov'){}
   else if(d.id==='koshel'){if(G.hand[p].length>6)continue}
   else continue;
   cast(p,i,tgt&&tgt.uid);render();await sleep(700);did=true;break;
  }
  if(!did)break;
 }
 // 3. закалка
 const up=cardsOf(p).map(x=>x.c).filter(c=>canUpgrade(p,c)&&!c.sick).sort((a,b)=>b.atk-a.atk)[0];
 if(up&&G.coins[p]>=upgradeCost(up)+1){upgrade(p,up);render();await sleep(500)}
 // 4. атаки
 for(const {c} of cardsOf(p)){
  if(G.over)break;
  if(!locate(c.uid)||!canAct(c,p))continue;
  const ts=legalTargets(c);if(!ts.length)continue;
  let pick=null;
  const kills=ts.filter(t=>!t.face).map(t=>locate(t.uid).c).filter(t=>Math.max(0,c.atk-kwN(D[t.id],'Щит'))>=t.hp||(has(D[c.id],'Пожирает')&&t.hp<=3)).sort((a,b)=>D[b.id].reward-D[a.id].reward);
  const face=ts.find(t=>t.face);
  if(kills.length&&(D[kills[0].id].reward>0||!face))pick={uid:kills[0].uid};
  else if(face)pick=face;
  else{const t=ts.map(t=>locate(t.uid).c).sort((a,b)=>a.hp-b.hp)[0];pick={uid:t.uid}}
  G.mode={kind:'botatk',uid:c.uid};render();await sleep(450);
  attack(c,pick);G.mode=null;render();await sleep(650);
 }
 busy=false;
 if(!G.over)startTurn(0);
}

function rulesHTML(){
 return `<div class="screen">${nav(true)}<h2 class="h2" style="margin-bottom:14px">Правила</h2><div class="rules">
  <div class="rule"><h3>Цель</h3><p>Сведи жизни соперника к нулю. На старте у каждого 25 жизней, 5 карт и 3 монеты. Второй игрок получает ещё 1 монету.</p></div>
  <div class="rule"><h3>Стол</h3><p>У каждого игрока 5 миров в ряд, мир стоит напротив мира. В каждом мире 2 места. Значок мира в правом нижнем углу показывает его родной класс.</p></div>
  <div class="rule"><h3>Об игре</h3><p>Омут — дуэльная карточная игра против бота. Шесть миров, твари из славянских сказок, монеты за каждую убитую карту. Партия идёт 10–15 минут: выставляй существ, защищай свои миры и бей миры соперника, пока его жизни не кончатся.</p></div>
  <div class="rule"><h3>Кого можно поставить в мир</h3><p>Любое существо можно поставить в любой мир: в атаку, в защиту, куда нужно. Первая карта в мире встаёт без ограничений. Ограничение только на пару из двух карт в одном мире.</p>
   <ul><li>Можно: два существа одного класса, например Нежить и Нежить в Яви.</li>
   <li>Можно: существо родного класса мира и любое другое, например в Нави Нежить и Люди.</li>
   <li>Нельзя: два разных чужих класса, например в Нави Люди и Чудища.</li></ul>
   <p>Значок мира в правом нижнем углу показывает его родной класс. В Омуте родного класса нет, туда ставят пары только одного класса.</p></div>
  <div class="rule"><h3>Как играть картами</h3><p>Твоя рука лежит снизу. Тяни карту пальцем или мышью и бросай в нужный мир. Сверху поле соперника, а над ним его рука рубашкой вверх: что у него в руке, ты не знаешь.</p></div>
  <div class="rule"><h3>Подглядывание</h3><p>Некоторые карты позволяют посмотреть руку соперника или верхние карты Омута. Так можно узнать, что он готовит, и подготовить защиту.</p></div>
  <div class="rule"><h3>Подсказки</h3><ul><li>Нажми кнопку переворота на любой карте, чтобы прочитать, что она делает и сколько монет дают за её убийство.</li><li>Пустой мир напротив врага значит удар прямо по твоим жизням. Закрывай его хотя бы дешёвой картой за 0 монет.</li><li>Защитник с Приоритетом прикрывает соседа: враг бьёт сначала его.</li><li>Копи монеты под сильную карту, но помни: копилка вмещает только 10.</li></ul></div>
  <div class="rule"><h3>Ход</h3><ul><li>Возьми карту из Омута.</li><li>Получи доход: 2 монеты на ходах 1–2, потом 3, 4 и с 7-го хода 5. Копилка до 10.</li><li>Ставь существ, играй чары, закаляй, сжигай лишние карты (+1 монета, до 2 раз за ход).</li><li>Атакуй и нажми «Закончить ход».</li></ul></div>
  <div class="rule"><h3>Атака</h3><p>Существо бьёт одну из карт в мире напротив. Поставленное существо атакует со следующего хода, если у него нет Рывка. Если мир напротив пуст, удар идёт в жизни соперника, пока он не закроет мир.</p></div>
  <div class="rule"><h3>Монеты за убийство</h3><p>У каждой карты слева сверху под ценой написано, сколько монет получит тот, кто её убьёт: от 0 до 5. Мелкие защитники стоят 0.</p></div>
  <div class="rule"><h3>Умения</h3><ul>
   <li><b>Приоритет</b>: враг в мире напротив бьёт только эту карту.</li>
   <li><b>Дальнобой</b>: бьёт в любой мир и не смотрит на Приоритет.</li>
   <li><b>Рывок</b>: атакует в ход, когда поставлен.</li>
   <li><b>Щит N</b>: каждый удар по карте слабее на N.</li>
   <li><b>Яд N</b>: цель теряет N ХП в начале каждого своего хода.</li>
   <li><b>Кровь N</b>: после атаки забирает N жизней соперника себе.</li>
   <li><b>Таран</b>: лишний урон уходит в жизни соперника.</li>
   <li><b>Стойкость</b>: первый смертельный удар оставляет 1 ХП.</li>
   <li><b>Жадность N</b>: +N монет в начале твоего хода.</li>
   <li><b>Лекарь N</b>: лечит соседа на N в начале хода.</li>
   <li><b>Пожирает</b>: съедает цель с 3 ХП или меньше.</li></ul></div>
  <div class="rule"><h3>Закалка</h3><p>За 2 монеты своё существо получает +1 урон навсегда. Одной карте не чаще раза за ход и не больше 3 раз за всю жизнь.</p></div>
  <div class="rule"><h3>Если Омут опустел</h3><p>Дно перемешивается в новый Омут, и с этого момента оба игрока теряют по 1 жизни в начале каждого своего хода.</p></div>
 </div></div>`;
}

function runFx(){
 const list=fx;fx=[];
 list.forEach(f=>{
  const el=f.face!=null?document.getElementById('face'+f.face):document.querySelector(`.card[data-uid="${f.uid}"]`);
  if(!el)return;
  if(f.face==null)el.classList.add('hit');
  const s=document.createElement('span');s.className='fx '+(f.k||'');s.textContent=f.t;
  const host=f.face!=null?el:el;host.style.position='relative';host.appendChild(s);
  setTimeout(()=>{s.remove();el.classList.remove('hit')},1000);
 });
}

function setErr(t){G.mode=Object.assign({},G.mode||{},{err:t});render();setTimeout(()=>{if(G&&G.mode&&G.mode.err===t){delete G.mode.err;render()}},2600)}
document.addEventListener('click',e=>{
 const t=e.target;
 // окно
 if(t.closest('[data-close]')&&(t.matches('[data-close]')||t.closest('button[data-close]'))){if(t.closest('.flip')&&!t.closest('button'))return;modal.innerHTML='';return}
 if(t.closest('[data-act="mflip"]')||t.closest('#mflip')){document.getElementById('mflip').classList.toggle('on');return}
 const fb=t.closest('[data-flip]');if(fb){e.stopPropagation();openFlip(fb.dataset.flip,fb.dataset.uid);return}
 const go=t.closest('[data-go]');
 if(go){const g=go.dataset.go;
  if(g==='rules-in'){screen='rules';render();return}
  if(g==='toss'){const sel=document.getElementById('hpSel');if(sel)startHp=+sel.value;newGame(startHp);screen='toss';render();setTimeout(()=>{const r=document.getElementById('tossRes'),c=document.getElementById('coin');if(!r)return;c.textContent=G.first===0?'Ты':'Бот';r.textContent=G.first===0?'Первым ходишь ты':'Первым ходит Бот';document.getElementById('tossNext').hidden=false},1450);return}
  if(g==='rules'||g==='best'||g==='menu'||g==='mull'){if(g==='menu'&&G&&!G.over&&screen==='rules'){screen='game';render();return}screen=g;render();return}
 }
 const bf=t.closest('[data-bflip]');if(bf){bf.classList.toggle('on');return}
 const fl=t.closest('[data-filter]');if(fl){bestFilter=fl.dataset.filter;render();return}
 const mu=t.closest('[data-mull]');if(mu){const id=+mu.dataset.mull;G.mullMarks.has(id)?G.mullMarks.delete(id):G.mullMarks.add(id);render();return}
 const act=t.closest('[data-act]');
 if(act){const a=act.dataset.act;
  if(a==='mull-go'){const keep=G.hand[0].filter(h=>!G.mullMarks.has(h.hid));const back=G.hand[0].filter(h=>G.mullMarks.has(h.hid));G.hand[0]=keep;back.forEach(h=>G.deck.push(h.id));shuffle(G.deck);back.forEach(()=>draw(0,true));G.mullMarks.clear();screen='game';log(null,`Миры на столе: ${G.worlds.map(k=>WORLDS[k].name).join(', ')}.`);startTurn(G.first);return}
  if(a==='surrender'){G.over='lose';screen='result';render();return}
  if(G.turn!==0||busy||G.over)return;
  if(a==='end'){endTurn();return}
  if(a==='cancel'){G.mode=null;render();return}
  if(a==='upgrade'){G.mode=G.mode&&G.mode.kind==='upgrade'?null:{kind:'upgrade'};render();return}
  if(a==='burn'){const i=G.hand[0].findIndex(h=>h.hid===G.mode.hid);if(i<0||G.burned>=2)return;const h=G.hand[0].splice(i,1)[0];G.discard.push(h.id);G.burned++;addCoins(0,1);log(0,`Ты сжигаешь ${D[h.id].name}: +1 монета.`);G.mode=null;render();return}
  if(a==='cast-none'){const i=G.hand[0].findIndex(h=>h.hid===G.mode.hid);const d=D[G.hand[0][i].id];if(d.cost>G.coins[0])return setErr(`Не хватает монет: нужно ${d.cost}.`);G.mode=null;cast(0,i);render();return}
 }
 if(screen!=='game'||!G||G.turn!==0||busy||G.over)return;
 const m=G.mode||{};
 // рука
 const hc=t.closest('[data-hid]');
 if(hc){const hid=+hc.dataset.hid;G.mode=(m.kind==='hand'&&m.hid===hid)?null:{kind:'hand',hid};render();return}
 // место
 const pl=t.closest('[data-place]');
 if(pl){const [w,s]=pl.dataset.place.split('-').map(Number);
  if(m.kind==='hand'){const i=G.hand[0].findIndex(h=>h.hid===m.hid),id=G.hand[0][i].id,d=D[id];const r=canPlace(0,w,s,id);if(!r.ok)return setErr(r.why);if(d.cost>G.coins[0])return setErr(`Не хватает монет: ${d.name} стоит ${d.cost}, у тебя ${G.coins[0]}.`);
   G.coins[0]-=d.cost;G.stats.spent[0]+=d.cost;G.hand[0].splice(i,1);G.mode=null;place(0,w,s,id);render();return}
  if(m.kind==='copyPlace'){const r=canPlace(0,w,s,m.id);if(!r.ok)return setErr(r.why);const i=G.hand[0].findIndex(h=>h.hid===m.hid);G.coins[0]-=5;G.stats.spent[0]+=5;G.discard.push(G.hand[0][i].id);G.hand[0].splice(i,1);const id=m.id;G.mode=null;place(0,w,s,id,true);render();return}
  return}
 // удар по жизням
 const fc=t.closest('[data-face]');
 if(fc&&m.kind==='attack'){const c=locate(m.uid).c;G.mode=null;attack(c,{face:true});render();return}
 // карта на поле
 const bc=t.closest('.card[data-uid]');
 if(bc){const uid=+bc.dataset.uid,side=+bc.dataset.side,L=locate(uid);if(!L)return;
  if(m.kind==='hand'){const i=G.hand[0].findIndex(h=>h.hid===m.hid),d=D[G.hand[0][i].id];
   if(d.type==='s'){if(d.cost>G.coins[0])return setErr(`Не хватает монет: ${d.name} стоит ${d.cost}.`);
    if(!spellTargets(0,d).includes(uid))return setErr(d.target==='enemy'?'Сюда нельзя: в этом мире есть защитник с Приоритетом, бей его.':'Эта цель не подходит.');
    if(d.target==='copy'){const cid=L.c.id;let any=false;for(let w=0;w<5;w++)for(let s=0;s<2;s++)if(canPlace(0,w,s,cid).ok)any=true;if(!any)return setErr(`Для копии ${D[cid].name} нет места: нужен свободный слот по правилу класса.`);G.mode={kind:'copyPlace',id:cid,hid:m.hid};render();return}
    G.mode=null;cast(0,i,uid);render();return}
  }
  if(m.kind==='upgrade'&&side===0){if(!canUpgrade(0,L.c))return setErr(L.c.upgTurn?'Эту карту уже закаляли в этот ход.':L.c.upg>=3?'Больше 3 закалок нельзя.':'Не хватает монет на закалку.');upgrade(0,L.c);G.mode=null;render();return}
  if(m.kind==='attack'&&side===1){const att=locate(m.uid).c;if(!legalTargets(att).some(x=>x.uid===uid))return setErr('Сюда нельзя: бить можно мир напротив, а если там стоит Приоритет, то только его.');G.mode=null;attack(att,{uid});render();return}
  if(side===0){if(canAct(L.c,0)){G.mode=m.kind==='attack'&&m.uid===uid?null:{kind:'attack',uid};render()}else setErr(L.c.atk<=0?`${D[L.c.id].name} не атакует.`:L.c.sick?`${D[L.c.id].name} только встал на поле и ударит со следующего хода.`:`${D[L.c.id].name} уже атаковал в этот ход.`);return}
 }
 if(m.kind==='hand'&&t.closest('.slot[data-why]')){const [w,s]=t.closest('.slot').dataset.place.split('-').map(Number);const id=G.hand[0].find(h=>h.hid===m.hid).id;return setErr(canPlace(0,w,s,id).why)}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(modal.innerHTML){modal.innerHTML='';return}if(G&&G.mode){G.mode=null;render()}}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}
});
document.addEventListener('change',e=>{if(e.target.id==='hpSel')startHp=+e.target.value});

// ================= запуск =================
function start(data){
 if(data&&data.G){G=data.G;screen=data.screen;uidN=data.uidN;G.mullMarks=new Set();busy=false;}
 render();
 if(screen==='game'&&G&&G.turn===1&&!G.over)botTurn();
}
window.claude?.hot?.snapshot?.(()=>({G:G?Object.assign({},G,{mullMarks:null}):null,screen:screen==='toss'?'mull':screen,uidN}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
